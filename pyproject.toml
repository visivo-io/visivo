[project]
name = "visivo"
version = "2.3.0"
description = "Visivo CLI for BI and visualizations as code"
authors = [
    {name = "Visivo People"}
]
requires-python = ">=3.12,<3.15"
readme = "README.md"
# Stated rather than derived: poetry generated these from requires-python, and
# hatchling does not, so dropping them would quietly narrow what PyPI reports.
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "Flask>=2.2.3",
    "PyYAML>=6.0",
    "aiofiles>=24.1.0",
    "assertpy>=1.1",
    "click>=8.1.3",
    "clickhouse-sqlalchemy>=0.3.0",
    "deepmerge>=1.1.0",
    "duckdb-engine>=0.14.0",
    "flask-socketio>=5.5.1",
    "halo>=0.0.31",
    "httpx>=0.27.2",
    "jsonschema-rs>=0.30.0",
    "networkx>=3.1",
    "numpy>=2.1.0,<3.0.0",
    "orjson>=3.10.0",
    "polars>=1.31.0,<2.0.0",
    "posthog>=6.1.0,<7.0.0",
    "psycopg2-binary>=2.9.5",
    "pyarrow>=20.0.0",
    "pydantic>=2.9.0",
    "pydantic-ai-slim[anthropic,google,openai]>=2.51.0,<3.0.0",
    "pymysql>=1.1.0",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.0.0",
    "redshift-connector>=2.1.8,<3.0.0",
    "requests>=2.28.2",
    "ruamel-yaml>=0.18.6",
    "snowflake-connector-python>=3.7.0,<5",
    "snowflake-sqlalchemy>=1.6.1,<2",
    "sql-formatter>=0.6.2",
    "sqlalchemy>=2.0.8",
    "sqlalchemy-bigquery>=1.12.0",
    "sqlglot>=27.0.0,<28.0.0",
    "tenacity>=9.0.0",
    "termcolor>=2.4.0",
    "tornado>=6.3",
    "watchdog>=6.0.0",
]

[project.urls]
Documentation = "https://docs.visivo.io/"

[project.optional-dependencies]
# Dashboard screenshots for the agent (VIS-1484). Optional because the browser
# behind playwright is a 260MB download and most people never ask for one;
# `pip install 'visivo[screenshot]'` opts in, and the tool says so when it is
# missing. Pillow is only for the one downscale in agent/screenshot.py.
screenshot = [
    "playwright>=1.56.0",
    "pillow>=10.0.0",
]

[project.scripts]
visivo = "visivo.command_line:safe_visivo"
write-schema-json = "visivo.generate_project_schema_json:write_schema_json"
copy-install-script = "visivo.copy_install_script:copy_script"
build = "visivo.build:build"

[dependency-groups]
dev = [
    # Also in the `screenshot` extra. Here as well because tests/agent/test_screenshot.py
    # exercises the downscale and the missing-package refusal, so CI needs them even
    # though a user installing visivo does not.
    "playwright>=1.56.0",
    "pillow>=10.0.0",
    "black>=25.1.0",
    "codespell>=2.2.4",
    "factory-boy>=3.2.1",
    "mkdocs>=1.4.2",
    "mkdocs-autolinks-plugin>=0.7.1",
    "mkdocs-click>=0.8.0",
    "mkdocs-encryptcontent-plugin>=2.4.5",
    "mkdocs-include-markdown-plugin>=6.2.2",
    "mkdocs-macros-plugin>=0.7.0",
    "mkdocs-material>=9.7.0,<10",
    "mkdocs-spellcheck[all]>=1.0.0",
    "mkdocs-video>=1.5.0",
    "pymdown-extensions>=10.12",
    "pytest>=8.0.0",
    "pytest-env>=1.0.1",
    "pytest-httpx>=0.32.0",
    "pytest-json-report>=1.5.0",
    "pytest-mock>=3.14.0",
    "requests-mock>=1.11.0",
    "setuptools>=67.7.2",
    "symspellpy>=6.7.7",
    "nuitka>=2.7.6,<3.0.0",
    "pyinstaller>=6.14.0,<7.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "coverage>=7.13.0,<8.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["visivo"]

[tool.hatch.build.targets.wheel]
packages = ["visivo"]

[tool.black]
line-length = 100
# Target py312 (our lowest supported version) so Black emits formatting that
# stays valid across the whole 3.12–3.14 support range, even though dev/CI now
# runs on 3.14. This also keeps the diff stable for contributors on 3.12/3.13.
target-version = ["py312"]
