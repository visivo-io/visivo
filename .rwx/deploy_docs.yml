on:
  github:
    push:
      if: ${{ event.git.ref=~ '^refs/tags/v.+$' }}
      init:
        commit-sha: ${{ event.git.sha }}

  dispatch:
    - key: deploy-docs
      init:
        commit-sha: ${{ event.git.sha }}

base:
  image: ubuntu:22.04
  config: rwx/base 1.1.1

tasks:
  - key: code
    call: git/clone 2.0.8
    with:
      repository: https://github.com/visivo-io/visivo.git
      preserve-git-dir: true
      ref: ${{ init.commit-sha }}
      github-token: ${{ github.token }}

  - key: python
    call: python/install 1.4.5
    with:
      python-version: 3.14.6

  - key: Install-CLI-Dependencies
    use: [code, python]
    run: pip install uv && uv sync --frozen

  - key: Generate-Schema
    use: [Install-CLI-Dependencies]
    run: |
      uv run pytest tests/parsers/test_schema_generator.py 
      find tmp -name visivo_schema.json -exec cp {} ./mkdocs/assets \;

  - key: Generate-Configuration-Files
    use: [Generate-Schema]
    run: uv run python mkdocs/src/write_mkdocs_markdown_files.py

  - key: Deploy-mkdocs-to-docs-site
    use: [Generate-Configuration-Files]
    run: |
      PYTHONPATH=$PWD uv run mkdocs build
      PYTHONPATH=$PWD uv run mkdocs gh-deploy --force
    env:
      GITHUB_ACCESS_TOKEN: ${{ secrets.VISIVO_GITHUB_GENERAL_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.VISIVO_GITHUB_GENERAL_TOKEN }}
