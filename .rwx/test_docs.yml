on:
  github:
    pull_request:
      if: ${{ event.github.pull_request.pull_request.draft == false }}
      actions: [opened, reopened, synchronize, ready_for_review]
      target: [docs-parity, mkdocs, check-for-spelling-errors]
      init:
        commit-sha: ${{ event.git.sha }}
        pr-num: ${{ event.github.pull_request.pull_request.number }}
        run-kind: pr
  dispatch:
    key: visivo-docs-preview
    params:
      - key: pr-num
        name: PR number
        description: The PR that gets the preview link. Dispatch on the PR's branch.
        required: true
    target: [docs-preview, comment-preview-link]
    init:
      commit-sha: ${{ event.git.sha }}
      pr-num: ${{ event.dispatch.params.pr-num }}
      run-kind: preview
    title: Docs preview for PR ${{ init.pr-num }}

concurrency-pools:
  - id: visivo-io/visivo:docs-${{ init.run-kind }}-${{ init.pr-num }}
    if: ${{ init.pr-num != "" }}
    capacity: 1
    on-overflow: cancel-running

base:
  image: ubuntu:22.04
  config: rwx/base 1.1.1

tasks:
  - key: code
    call: git/clone 2.0.8
    with:
      repository: https://github.com/visivo-io/visivo.git
      preserve-git-dir: true
      ref: ${{ init.commit-sha }}
      github-token: ${{ github.token }}

  - key: versions
    use: code
    run: cat .python-version | tee $RWX_VALUES/python
    filter: [.python-version]

  - key: python
    call: python/install 1.4.5
    with:
      python-version: ${{ tasks.versions.values.python }}

  - key: cli-dependencies
    use: [code, python]
    run: pip install poetry && poetry install --with dev --no-root
    filter:
      - poetry.lock
      - pyproject.toml

  # Docs-vs-code parity guard (VIS-874). Fast static checks that keep the
  # model-generated reference honest and block 2.0-deprecated prose:
  #   1. the committed schema JSON matches a freshly generated schema,
  #   2. every model with a generated reference page has a non-empty description,
  #   3. no banned 2.0 phrases ("traces:" key, "trace types") in docs prose,
  #   4. every YAML fence in the docs and in the model docstrings is config the
  #      real schema accepts (test_docs_examples.py).
  # These also run in the full suite (test_visivo.yml -> test-cli), but are
  # pinned here so the docs pipeline alone enforces parity.
  - key: docs-parity
    use: cli-dependencies
    run: |
      poetry install --with dev
      poetry run pytest tests/docs/test_docs_parity.py tests/docs/test_docs_examples.py -v --tb=short

  - key: mkdocs
    use: cli-dependencies
    run: |
      poetry install --with dev
      poetry run pytest tests/parsers/test_schema_generator.py
      find tmp -name visivo_schema.json -exec cp {} ./mkdocs/assets \;
      poetry run python mkdocs/src/write_mkdocs_markdown_files.py
      poetry run mkdocs serve > mkdocs.log 2>&1 &
      sh mkdocs/check-connection.sh
      wget --recursive --no-verbose --spider http://127.0.0.1:8000/ 2>&1 | grep -v -E 'OK$|^unlink|\.tmp\.tmp'
      PYTHONPATH=$PWD poetry run mkdocs build 2>&1 | tee build_stdout.txt

  - key: check-for-spelling-errors
    use: mkdocs
    run: sh validate_mkdocs_build.sh
    filter:
      - build_stdout.txt
      - validate_mkdocs_build.sh

  - key: github-cli
    call: github/install-cli 1.0.11

  # Docs preview app, started only by the visivo-docs-preview dispatch. Serves the built site (site_dir: mkdocs_build) on an
  # on-demand rwx.run URL; spins down after 10 min idle and re-materializes from
  # the task cache when the URL is hit again.
  - key: docs-preview
    use: [mkdocs]
    app:
      endpoint: docs-pr-${{ init.pr-num }}
      port: 8000
      timeout: 2m
    run: python3 -m http.server $PORT --directory mkdocs_build

  - key: comment-preview-link
    use: [code, github-cli]
    run: |
      BODY="📚 Docs preview: $DOCS_PREVIEW_URL (built from ${COMMIT_SHA:0:7})"
      COMMENT_ID=$(gh api "repos/visivo-io/visivo/issues/$PR_NUM/comments" --jq '[.[] | select(.body | startswith("📚 Docs preview:"))][0].id // empty')
      if [ -n "$COMMENT_ID" ]; then
        gh api -X PATCH "repos/visivo-io/visivo/issues/comments/$COMMENT_ID" -f body="$BODY" > /dev/null
      else
        gh pr comment "$PR_NUM" --body "$BODY"
      fi
    env:
      DOCS_PREVIEW_URL: ${{ tasks.docs-preview.app.url.friendly }}
      PR_NUM: ${{ init.pr-num }}
      COMMIT_SHA: ${{ init.commit-sha }}
      GH_TOKEN: ${{ vaults.default.github-apps.mint-automation-visivo.token }}
