on:
  github:
    pull_request:
      actions: [opened, reopened, synchronize]
      init:
        commit-sha: ${{ event.git.sha }}
        pr-num: ${{ event.github.pull_request.pull_request.number }}
    push:
      if: ${{ event.git.branch == 'main' || event.git.ref =~ '^refs/tags/v.+$' }}
      init:
        commit-sha: ${{ event.git.sha }}
        pr-num: ""

# A stale run for a PR commit that's already been superseded by a newer push
# is wasted compute — its result is thrown away either way once the newer one
# lands, so cancel it outright instead of letting it finish. main/tag pushes
# are excluded: a landed commit on main deserves its own completed test
# record, not one a later merge can cancel out from under it.
concurrency-pools:
  - id: visivo-io/visivo:test-pr-${{ init.pr-num }}
    if: ${{ init.pr-num != "" }}
    capacity: 1
    on-overflow: cancel-running

base:
  image: ubuntu:22.04
  config: rwx/base 1.1.1

tasks:
  - key: code
    call: git/clone 2.0.8
    with:
      # diff-stats runs `git fetch origin main` to size the PR.
      preserve-git-dir: true
      repository: https://github.com/visivo-io/visivo.git
      ref: ${{ init.commit-sha }}
      github-token: ${{ github.token }}
      fetch-full-depth: true

  - key: versions
    use: code
    run: |
      cat .python-version | tee $RWX_VALUES/python
      cat viewer/.nvmrc | sed 's/^v//' | tee $RWX_VALUES/node
    filter:
      - .python-version
      - viewer/.nvmrc

  - key: python
    call: python/install 1.4.5
    with:
      python-version: ${{ tasks.versions.values.python }}

  - key: node
    call: nodejs/install 1.1.15
    with:
      node-version: ${{ tasks.versions.values.node }}

  - key: poetry
    use: python
    run: pip install poetry

  # dbt does not support Python 3.14 yet: dbt-core pins mashumaro<3.15, but
  # mashumaro only gained 3.14 support in 3.15+. Run the dbt integration lane
  # on 3.12 (the highest Python dbt supports, also a version visivo supports)
  # while the rest of CI runs on the .python-version interpreter (3.14).
  - key: python-dbt
    call: python/install 1.4.5
    with:
      python-version: "3.12.10"

  - key: poetry-dbt
    use: python-dbt
    run: pip install poetry

  - key: cli-dependencies
    use: [code, poetry]
    run: poetry install --with dev --no-root
    filter:
      - poetry.lock
      - pyproject.toml

  # Both of these were unfiltered, so any change anywhere rebuilt the wheel
  # and the PyInstaller binary — and because a task's cache key includes its
  # dependencies', that invalidated every integration lane below whose own
  # `filter:` was therefore doing nothing.
  #
  # README.md is in the filter because `readme = "README.md"` in pyproject:
  # `poetry build`, and `poetry install` without --no-root, both read it. A
  # filter strips every workspace file it does not name, so leaving it out
  # fails the build rather than merely over-caching.
  - key: visivo-pip-install
    use: cli-dependencies
    run: |
      poetry install --with dev
      poetry build
      pip install dist/visivo-*-py3-none-any.whl
    filter:
      - pyproject.toml
      - poetry.lock
      - README.md
      - visivo

  - key: visivo-install
    use: visivo-pip-install
    run: |
      poetry run build
    filter:
      - pyproject.toml
      - poetry.lock
      - README.md
      - visivo

  - key: test-cli
    use: [cli-dependencies]
    run: |
      trap 'curl -X POST -H "Content-Type: application/json" -d @.report.json ${{ secrets.PYTEST_RESULTS_WEBHOOK }}' EXIT
      poetry install --with dev
      poetry run pytest --json-report \
        --cov=visivo --cov-report=json:coverage-python.json
    env:
      STACKTRACE: true

  - key: lint-cli
    use: [cli-dependencies]
    run: |
      poetry run black --check . --target-version py312

  - key: test-onboarding-samples
    use: [cli-dependencies]
    run: |
      poetry install --with dev
      poetry run pytest tests/templates/test_samples.py -v --tb=short
    env:
      STACKTRACE: true
    # No `filter:` here — in Mint, `filter:` strips non-matching files from
    # the workspace, which would drop pyproject.toml / poetry.lock and make
    # `poetry install` fail with "Poetry could not find a pyproject.toml".
    # The sample smoke test runs in ~10s; always run it.

  - key: yarn
    use: node
    run: npm install --global yarn

  - key: node-modules
    use: [code, yarn]
    run: |
      cd viewer
      yarn install
    filter:
      - viewer/package.json
      - viewer/yarn.lock

  - key: viewer-test
    use: node-modules
    run: |
      cd viewer
      yarn test --json --testLocationInResults --outputFile jest.json \
        --coverage --coverageReporters=json-summary \
        --coverageDirectory=../coverage-js
    filter: [viewer, visivo]
    outputs:
      test-results:
        - path: viewer/jest.json

  - key: viewer-lint
    use: node-modules
    run: |
      cd viewer
      yarn run lint --max-warnings=0
      yarn run prettier --check
    filter: [viewer]
    outputs:
      problems:
        - matcher: eslint

  - key: test-complex-project
    use: visivo-install
    run: |
      cd test-projects/complex-project
      visivo run
    env:
      STACKTRACE: true
    filter: [test-projects/complex-project]

  - key: test-docs-examples-project
    use: [visivo-pip-install]
    run: |
      cd test-projects/docs-examples
      visivo run -th 3 
      visivo test
    env:
      STACKTRACE: true
    filter: [test-projects/docs-examples]

  - key: test-duckdb-concurrency
    use: visivo-install
    run: |
      cd test-projects/duckdb-concurrency
      visivo run
      visivo test
    env:
      STACKTRACE: true
    filter: [test-projects/duckdb-concurrency]

  - key: test-duckdb
    use: visivo-install
    run: |
      cd test-projects/integration
      visivo run -s local-duckdb
      python validate_run_results.py --source local-duckdb
    env:
      STACKTRACE: true
      DEBUG: true
    filter: [test-projects/integration]

  - key: test-serve-command
    use: visivo-install
    run: |
      cd test-projects/integration
      # Test that visivo serve starts without errors. The PyInstaller binary
      # takes 7-11s to print its first line on these runners, so 10s flaked.
      timeout 30 visivo serve -s local-duckdb || exit_code=$?
      # timeout returns 124 if it times out (expected behavior)
      if [ "${exit_code:-0}" -ne 0 ] && [ "${exit_code:-0}" -ne 124 ]; then
        echo "visivo serve failed with exit code $exit_code"
        exit 1
      fi
      # Verify that the project compiled successfully. (project.json is no longer
      # a compile artifact — it's generated only by `visivo dist` now — so check
      # error.json, which compile still writes.)
      test -f target/error.json || (echo "error.json not found" && exit 1)
      echo "visivo serve started successfully"
    env:
      STACKTRACE: true
      DEBUG: true
    filter: [test-projects/integration]

  - key: test-dist-command
    # `visivo dist` exits 0 even when the bundle it wrote cannot render — the
    # command writes files and never loads them. That gap shipped a real
    # regression: `/api/project/` stopped carrying the dereferenced project,
    # resource lists moved to their own endpoints, and dist was never given an
    # equivalent for the dashboards list, so every static build rendered
    # "No dashboards found" while the command reported success.
    #
    # So this builds a bundle and actually LOADS a dashboard in a browser,
    # asserting charts render with no failed `/data/*` request and no console
    # errors. Unit tests cover the file shapes; only this covers "does it work".
    use: [visivo-install, node-modules]
    background-processes:
      - key: dist-server
        # Build THEN serve in the same process: the bundle doesn't exist until
        # `visivo dist` runs, so a server started alongside the task would have
        # nothing to answer with and its ready-check would never pass.
        #
        # `serve_dist.py` reproduces the `_redirects` SPA rule dist writes, so
        # `/<dashboard>` resolves the way it does on a real static host rather
        # than 404ing.
        run: |
          # Build the viewer from THIS commit's source. The committed
          # `visivo/viewers/dist` bundle is only refreshed at release time, so
          # on any non-release commit it lags the viewer source — testing it
          # would assert against the last release, not the change under review.
          set -e
          cd viewer && yarn deploy:dist && cd ..
          # `visivo` is pip-installed, so `DIST_PATH` resolves inside
          # site-packages and the fresh build has to land THERE — `yarn
          # deploy:dist` only writes the repo checkout, which the installed CLI
          # never reads.
          #
          # Resolve that path from /tmp, not from here: the workspace root
          # contains a `visivo/` package directory, and python puts cwd first on
          # sys.path, so importing from here yields the CHECKOUT's DIST_PATH.
          # Copying there leaves site-packages stale and `visivo dist` ships the
          # last release's viewer — which is exactly how the first run of this
          # task failed, with the browser throwing the pre-fix
          # "'dashboardsList' is not available in 'dist' environment".
          VIEWER_BUILD="$PWD/viewer/build"
          DIST_PATH=$(cd /tmp && python -c "from visivo.utils import DIST_PATH; print(DIST_PATH)")
          echo "Installing freshly-built viewer into $DIST_PATH"
          rm -rf "$DIST_PATH"
          cp -R "$VIEWER_BUILD" "$DIST_PATH"
          # Fail loudly here rather than as a confusing browser error later.
          diff -q "$VIEWER_BUILD/index.html" "$DIST_PATH/index.html"
          cd test-projects/integration
          visivo run -s local-duckdb
          visivo dist -s local-duckdb
          cd ../..
          python scripts/serve_dist.py test-projects/integration/dist 8899
        # Asserts the dashboards LIST is present and served — the exact
        # artifact whose absence caused the regression — before the browser
        # check starts, so a missing one fails here with a clear cause.
        ready-check: curl -fsS http://localhost:8899/data/dashboards.json >/dev/null
    run: |
      cd viewer
      yarn playwright install --with-deps chromium
      node scripts/dist-smoke.mjs http://localhost:8899 simple-dashboard
    env:
      STACKTRACE: true
    filter: [visivo, viewer, test-projects/integration, scripts]

  - key: offline-guard
    # Keeps Phase 1 of "Complete Install" true. Every CDN fetch this project
    # removed got in the same way: an import whose remote default nobody
    # noticed, in a bundle nobody inspected. `monaco-editor` was a direct
    # dependency for as long as the SQL editor existed and the editor was STILL
    # re-downloaded from jsdelivr at runtime, which meant the editor hung
    # forever offline. No unit test could see it, because none looked at the
    # network.
    #
    # Same shape as test-dist-command: build the real bundle, serve it, drive it
    # in a browser, assert on what it asked for. The allowlist lives in the
    # script with a reason per host.
    use: [visivo-install, node-modules]
    background-processes:
      - key: local-server
        # Build the LOCAL viewer from this commit, then make `visivo serve` use
        # it. Same trap as the dist task: `visivo` is pip-installed, so
        # VIEWER_PATH resolves inside site-packages and `yarn deploy:local` only
        # writes the checkout — without the copy this would test the last
        # release's bundle.
        #
        # VIEWER_PATH is resolved from /tmp because the workspace root holds a
        # `visivo/` package directory and python puts cwd first on sys.path.
        run: |
          set -e
          cd viewer && yarn deploy:local && cd ..
          VIEWER_BUILD="$PWD/viewer/build"
          VIEWER_PATH=$(cd /tmp && python -c "from visivo.utils import VIEWER_PATH; print(VIEWER_PATH)")
          echo "Installing freshly-built viewer into $VIEWER_PATH"
          rm -rf "$VIEWER_PATH"
          cp -R "$VIEWER_BUILD" "$VIEWER_PATH"
          diff -q "$VIEWER_BUILD/index.html" "$VIEWER_PATH/index.html"
          cd test-projects/integration
          visivo serve --port 8901 -s local-duckdb
        ready-check: curl -fsS http://localhost:8901/ >/dev/null
        env:
          CLICKHOUSE_PASSWORD: clickhouse
          LOCAL_SNOWFLAKE_PASSWORD: test
    run: |
      cd viewer
      yarn playwright install --with-deps chromium
      node scripts/offline-guard.mjs http://localhost:8901 local_test_table
    env:
      STACKTRACE: true
    filter: [visivo, viewer, test-projects/integration]

  - key: binary-init-smoke
    # Runs the PyInstaller bundle (dist/visivo/visivo) end-to-end against
    # `visivo init` in an empty directory — the exact path that crashed
    # in v2.0.2 with `cannot import name 'EmailOptions' from
    # 'jsonschema_rs.jsonschema_rs'`. Other binary tests in this file only
    # exercise `visivo run`, which lazy-loads a different import graph and
    # missed the bundling regression.
    #
    # The auto-launched dev server is a foreground, never-exiting process, so
    # it runs as a Mint background-process (which Mint tears down). Inlining it
    # in `run` with `&` orphaned the PyInstaller child and hung the task to the
    # 10-minute timeout.
    use: visivo-install
    background-processes:
      - key: init-serve
        # `init --headless` scaffolds a fresh project in an empty dir and then
        # boots `visivo serve`. A broken bundle crashes here on import, so the
        # ready-check never passes and the task fails fast (instead of hanging).
        run: |
          BIN="$(pwd)/dist/visivo/visivo"
          SERVE_DIR=$(mktemp -d)
          cd "$SERVE_DIR"
          "$BIN" init --headless --port 8765
        ready-check: curl -fsS http://localhost:8765/ >/dev/null
    run: |
      BIN="$PWD/dist/visivo/visivo"
      test -x "$BIN" || (echo "binary not found at $BIN" && exit 1)

      # --bare: exercise the full model import graph without binding a port.
      SMOKE_DIR=$(mktemp -d)
      (cd "$SMOKE_DIR" && "$BIN" init --bare)
      test -f "$SMOKE_DIR/project.visivo.yml" || (echo "project.visivo.yml not written" && exit 1)

      # The init-serve background process passed its ready-check (Flask booted
      # and served the onboarding page); assert it once more explicitly.
      curl -fsS http://localhost:8765/ >/dev/null \
        || (echo "init+serve not reachable on :8765" && exit 1)
    env:
      STACKTRACE: true
    filter: [dist]

  - key: postgres-packages
    run: |
      sudo apt-get update
      sudo apt-get install postgresql-client
      sudo apt-get clean

  - key: test-postgres
    docker: true
    use: [postgres-packages, visivo-install]
    background-processes:
      - key: postgres
        run: docker run -p 5434:5432 -e POSTGRES_PASSWORD=postgres index.docker.io/library/postgres:latest
        ready-check: PGPASSWORD=postgres psql -h localhost -p 5434 -U postgres -c 'SELECT 1'
    run: |
      PGPASSWORD=postgres psql -h localhost -p 5434 -U postgres -f tests/setup/populate_ci_postgres.sql
      ls
      cd test-projects/integration
      ../../dist/visivo/visivo run -s local-postgres --threads 1
      python validate_run_results.py --source local-postgres
    env:
      PGPASSWORD: postgres
      PG_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5434
      STACKTRACE: true
      DEBUG: true
    filter:
      - dist
      - test-projects/integration
      - tests/setup/populate_ci_postgres.sql

  - key: mysql-packages
    run: |
      sudo apt-get update
      sudo apt-get install mysql-client
      sudo apt-get clean

  - key: test-mysql
    docker: true
    use: [mysql-packages, visivo-install]
    background-processes:
      - key: mysql
        run: docker run -p 3306:3306 -e MYSQL_ROOT_PASSWORD=mysql index.docker.io/library/mysql:latest
        ready-check: mysql --protocol tcp -h localhost -u root -pmysql -e "SELECT 1;"
    run: |
      mysql --protocol tcp -h localhost -u root -pmysql < tests/setup/populate_ci_mysql.sql
      cd test-projects/integration
      ../../dist/visivo/visivo run -s local-mysql --threads 1
      python validate_run_results.py --source local-mysql
    env:
      MYSQL_PASSWORD: mysql
      IS_MYSQL: true
      STACKTRACE: true
      DEBUG: true
    filter:
      - dist
      - test-projects/integration
      - tests/setup/populate_ci_mysql.sql

  - key: test-clickhouse
    docker: true
    use: [visivo-install]
    background-processes:
      - key: clickhouse
        run: docker run --name clickhouse -p 18123:8123 -p 19000:9000 --ulimit nofile=262144:262144 -e CLICKHOUSE_USER=default -e CLICKHOUSE_PASSWORD=clickhouse -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 index.docker.io/clickhouse/clickhouse-server:latest
        ready-check: docker exec clickhouse clickhouse-client --user default --password clickhouse -q "SELECT 1"
    run: |
      docker exec -i clickhouse clickhouse-client --user default --password clickhouse --multiquery < tests/setup/populate_ci_clickhouse.sql
      cd test-projects/integration
      ../../dist/visivo/visivo run -s local-clickhouse --threads 1
      python validate_run_results.py --source local-clickhouse
    env:
      STACKTRACE: true
      DEBUG: true
      # Matches CLICKHOUSE_PASSWORD on the container above. The project YAML
      # holds ${env.CLICKHOUSE_PASSWORD} rather than the literal because core
      # rejects a source config carrying a credential.
      CLICKHOUSE_PASSWORD: clickhouse
    filter:
      - dist
      - test-projects/integration
      - tests/setup/populate_ci_clickhouse.sql

  - key: test-snowflake
    docker: true
    use: [visivo-install]
    background-processes:
      - key: fakesnow
        run: docker run -p 12345:12345 $(docker build -q -f tests/setup/fakesnow.Dockerfile .)
        ready-check: python -c "import socket; s=socket.create_connection(('localhost',12345),timeout=2); s.close()"
    run: |
      python tests/setup/seed_fakesnow.py
      cd test-projects/integration
      ../../dist/visivo/visivo run -s local-snowflake
      python validate_run_results.py --source local-snowflake
    env:
      STACKTRACE: true
      DEBUG: true
      # fakesnow accepts any credentials; this only has to be non-empty so the
      # project's ${env.LOCAL_SNOWFLAKE_PASSWORD} resolves.
      LOCAL_SNOWFLAKE_PASSWORD: test
    filter:
      - dist
      - test-projects/integration
      - tests/setup/populate_ci_snowflake.sql
      - tests/setup/fakesnow.Dockerfile
      - tests/setup/seed_fakesnow.py

  - key: test-bigquery
    use: visivo-install
    run: |
      cd test-projects/integration
      ../../dist/visivo/visivo run -s remote-bigquery
      python validate_run_results.py --source remote-bigquery
    env:
      STACKTRACE: true
      DEBUG: true
      BIGQUERY_BASE64_CREDENTIALS: ${{ secrets.BIGQUERY_BASE64_CREDENTIALS }}
      BIGQUERY_PROJECT: ${{ secrets.BIGQUERY_PROJECT }}
    filter:
      - dist
      - test-projects/integration

  - key: dbt-dependencies
    use: [code, poetry-dbt]
    run: |
      cd test-projects/dbt
      poetry config virtualenvs.in-project true --local
      poetry install --no-root
    filter:
      - test-projects/dbt/poetry.lock
      - test-projects/dbt/pyproject.toml

  - key: test-dbt
    use: [dbt-dependencies, visivo-install]
    run: |
      cd test-projects/dbt
      # dbt runs from its own in-project 3.12 venv (see dbt-dependencies);
      # visivo comes from visivo-install and runs on 3.14.
      ./.venv/bin/dbt seed --profiles-dir .
      ./.venv/bin/dbt run --profiles-dir .
      visivo compile
      visivo run
    filter:
      - test-projects/dbt
    env:
      STACKTRACE: true

  # The PR-summary comment. It lives here, next to the suites whose
  # coverage it reports, because `use:` layers a dependency's filesystem
  # and RWX artifacts do not cross runs — as a separate workflow it had to
  # re-run both suites to see their coverage.
  - key: github-cli
    call: github/install-cli 1.0.11
    if: ${{ init.pr-num != "" }}

  - key: diff-stats
    use: code
    if: ${{ init.pr-num != "" }}
    run: |
      git fetch origin main
      git diff --numstat origin/main...HEAD > /tmp/numstat.txt

      BE_PROD_ADD=0; BE_PROD_DEL=0; BE_PROD_FILES=0
      FE_PROD_ADD=0; FE_PROD_DEL=0; FE_PROD_FILES=0
      BE_TEST_UNIT_ADD=0; BE_TEST_UNIT_DEL=0; BE_TEST_UNIT_FILES=0
      BE_TEST_INT_ADD=0; BE_TEST_INT_DEL=0; BE_TEST_INT_FILES=0
      BE_TEST_E2E_ADD=0; BE_TEST_E2E_DEL=0; BE_TEST_E2E_FILES=0
      FE_TEST_UNIT_ADD=0; FE_TEST_UNIT_DEL=0; FE_TEST_UNIT_FILES=0
      FE_TEST_E2E_ADD=0; FE_TEST_E2E_DEL=0; FE_TEST_E2E_FILES=0
      OTHER_ADD=0; OTHER_DEL=0; OTHER_FILES=0

      > /tmp/be_prod_files.txt
      > /tmp/fe_prod_files.txt

      while IFS=$'\t' read -r added deleted filepath; do
        [ "$added" = "-" ] && continue

        # Resolve git rename syntax "dir/{old => new}/file" → "dir/new/file"
        # so existence checks below match the post-rename location.
        if echo "$filepath" | grep -q '{.* => .*}'; then
          filepath=$(echo "$filepath" | sed 's|{[^}]* => \([^}]*\)}|\1|')
        fi

        if echo "$filepath" | grep -qE '^tests/integration/'; then
          BE_TEST_INT_ADD=$((BE_TEST_INT_ADD + added))
          BE_TEST_INT_DEL=$((BE_TEST_INT_DEL + deleted))
          BE_TEST_INT_FILES=$((BE_TEST_INT_FILES + 1))
        elif echo "$filepath" | grep -qE '^tests/sandbox/'; then
          BE_TEST_E2E_ADD=$((BE_TEST_E2E_ADD + added))
          BE_TEST_E2E_DEL=$((BE_TEST_E2E_DEL + deleted))
          BE_TEST_E2E_FILES=$((BE_TEST_E2E_FILES + 1))
        elif echo "$filepath" | grep -qE '^tests/'; then
          BE_TEST_UNIT_ADD=$((BE_TEST_UNIT_ADD + added))
          BE_TEST_UNIT_DEL=$((BE_TEST_UNIT_DEL + deleted))
          BE_TEST_UNIT_FILES=$((BE_TEST_UNIT_FILES + 1))
        elif echo "$filepath" | grep -qE '^viewer/e2e/'; then
          FE_TEST_E2E_ADD=$((FE_TEST_E2E_ADD + added))
          FE_TEST_E2E_DEL=$((FE_TEST_E2E_DEL + deleted))
          FE_TEST_E2E_FILES=$((FE_TEST_E2E_FILES + 1))
        elif echo "$filepath" | grep -qE '^viewer/src/.*\.test\.(js|jsx)$'; then
          FE_TEST_UNIT_ADD=$((FE_TEST_UNIT_ADD + added))
          FE_TEST_UNIT_DEL=$((FE_TEST_UNIT_DEL + deleted))
          FE_TEST_UNIT_FILES=$((FE_TEST_UNIT_FILES + 1))
        elif echo "$filepath" | grep -qE '^visivo/.*\.py$'; then
          BE_PROD_ADD=$((BE_PROD_ADD + added))
          BE_PROD_DEL=$((BE_PROD_DEL + deleted))
          BE_PROD_FILES=$((BE_PROD_FILES + 1))
          # Skip deleted files — coverage lookup has nothing to report on them.
          [ -f "$filepath" ] && echo "$filepath" >> /tmp/be_prod_files.txt
        elif echo "$filepath" | grep -qE '^viewer/src/'; then
          FE_PROD_ADD=$((FE_PROD_ADD + added))
          FE_PROD_DEL=$((FE_PROD_DEL + deleted))
          FE_PROD_FILES=$((FE_PROD_FILES + 1))
          # Skip deleted files — coverage lookup has nothing to report on them.
          [ -f "$filepath" ] && echo "$filepath" >> /tmp/fe_prod_files.txt
        else
          OTHER_ADD=$((OTHER_ADD + added))
          OTHER_DEL=$((OTHER_DEL + deleted))
          OTHER_FILES=$((OTHER_FILES + 1))
        fi
      done < /tmp/numstat.txt

      cat > .diff_stats.env << STATSEOF
      BE_PROD_ADD=${BE_PROD_ADD}
      BE_PROD_DEL=${BE_PROD_DEL}
      BE_PROD_FILES=${BE_PROD_FILES}
      FE_PROD_ADD=${FE_PROD_ADD}
      FE_PROD_DEL=${FE_PROD_DEL}
      FE_PROD_FILES=${FE_PROD_FILES}
      BE_TEST_UNIT_ADD=${BE_TEST_UNIT_ADD}
      BE_TEST_UNIT_DEL=${BE_TEST_UNIT_DEL}
      BE_TEST_UNIT_FILES=${BE_TEST_UNIT_FILES}
      BE_TEST_INT_ADD=${BE_TEST_INT_ADD}
      BE_TEST_INT_DEL=${BE_TEST_INT_DEL}
      BE_TEST_INT_FILES=${BE_TEST_INT_FILES}
      BE_TEST_E2E_ADD=${BE_TEST_E2E_ADD}
      BE_TEST_E2E_DEL=${BE_TEST_E2E_DEL}
      BE_TEST_E2E_FILES=${BE_TEST_E2E_FILES}
      FE_TEST_UNIT_ADD=${FE_TEST_UNIT_ADD}
      FE_TEST_UNIT_DEL=${FE_TEST_UNIT_DEL}
      FE_TEST_UNIT_FILES=${FE_TEST_UNIT_FILES}
      FE_TEST_E2E_ADD=${FE_TEST_E2E_ADD}
      FE_TEST_E2E_DEL=${FE_TEST_E2E_DEL}
      FE_TEST_E2E_FILES=${FE_TEST_E2E_FILES}
      OTHER_ADD=${OTHER_ADD}
      OTHER_DEL=${OTHER_DEL}
      OTHER_FILES=${OTHER_FILES}
      STATSEOF

      cp /tmp/be_prod_files.txt .be_prod_files.txt
      cp /tmp/fe_prod_files.txt .fe_prod_files.txt

  - key: post-comment
    use: [diff-stats, test-cli, viewer-test, github-cli, code]
    if: ${{ init.pr-num != "" }}
    run: |
      source .diff_stats.env

      # === Parse Python coverage for changed backend files ===
      PY_COVERAGE_ROWS=""
      if [ -f coverage-python.json ] && [ -s .be_prod_files.txt ]; then
        while IFS= read -r filepath; do
          [ -z "$filepath" ] && continue
          COV_PCT=$(python3 -c "
      import json, sys
      with open('coverage-python.json') as f:
          data = json.load(f)
      target = '${filepath}'
      for key, val in data.get('files', {}).items():
          if key.endswith(target) or key.endswith(target.lstrip('./')):
              summary = val.get('summary', {})
              total = summary.get('num_statements', 0)
              covered = summary.get('covered_lines', 0)
              pct = round(100 * covered / total, 1) if total > 0 else 100.0
              print(pct)
              sys.exit(0)
      print('N/A')
      " 2>/dev/null || echo "N/A")

          if [ "$COV_PCT" = "N/A" ]; then
            PY_COVERAGE_ROWS="${PY_COVERAGE_ROWS}| \`${filepath}\` | No data | :grey_question: |
      "
          else
            IS_LOW=$(python3 -c "print('YES' if float('${COV_PCT}') < 50 else 'NO')" 2>/dev/null || echo "NO")
            if [ "$IS_LOW" = "YES" ]; then
              PY_COVERAGE_ROWS="${PY_COVERAGE_ROWS}| \`${filepath}\` | ${COV_PCT}% | :warning: Low |
      "
            else
              PY_COVERAGE_ROWS="${PY_COVERAGE_ROWS}| \`${filepath}\` | ${COV_PCT}% | :white_check_mark: |
      "
            fi
          fi
        done < .be_prod_files.txt
      fi

      # === Parse JS coverage for changed frontend files ===
      JS_COVERAGE_ROWS=""
      if [ -f coverage-js/coverage-summary.json ] && [ -s .fe_prod_files.txt ]; then
        while IFS= read -r filepath; do
          [ -z "$filepath" ] && continue
          RELATIVE_PATH=$(echo "$filepath" | sed 's|^viewer/||')
          COV_PCT=$(python3 -c "
      import json, sys
      with open('coverage-js/coverage-summary.json') as f:
          data = json.load(f)
      target = '${RELATIVE_PATH}'
      for key, val in data.items():
          if key == 'total':
              continue
          if key.endswith(target) or target in key:
              pct = val.get('lines', {}).get('pct', 'N/A')
              print(pct)
              sys.exit(0)
      print('N/A')
      " 2>/dev/null || echo "N/A")

          if [ "$COV_PCT" = "N/A" ]; then
            JS_COVERAGE_ROWS="${JS_COVERAGE_ROWS}| \`${filepath}\` | No data | :grey_question: |
      "
          else
            IS_LOW=$(python3 -c "print('YES' if float('${COV_PCT}') < 50 else 'NO')" 2>/dev/null || echo "NO")
            if [ "$IS_LOW" = "YES" ]; then
              JS_COVERAGE_ROWS="${JS_COVERAGE_ROWS}| \`${filepath}\` | ${COV_PCT}% | :warning: Low |
      "
            else
              JS_COVERAGE_ROWS="${JS_COVERAGE_ROWS}| \`${filepath}\` | ${COV_PCT}% | :white_check_mark: |
      "
            fi
          fi
        done < .fe_prod_files.txt
      fi

      # === Compute totals ===
      TOTAL_PROD_ADD=$((BE_PROD_ADD + FE_PROD_ADD))
      TOTAL_PROD_DEL=$((BE_PROD_DEL + FE_PROD_DEL))
      TOTAL_PROD_FILES=$((BE_PROD_FILES + FE_PROD_FILES))
      TOTAL_TEST_ADD=$((BE_TEST_UNIT_ADD + BE_TEST_INT_ADD + BE_TEST_E2E_ADD + FE_TEST_UNIT_ADD + FE_TEST_E2E_ADD))
      TOTAL_TEST_DEL=$((BE_TEST_UNIT_DEL + BE_TEST_INT_DEL + BE_TEST_E2E_DEL + FE_TEST_UNIT_DEL + FE_TEST_E2E_DEL))
      TOTAL_TEST_FILES=$((BE_TEST_UNIT_FILES + BE_TEST_INT_FILES + BE_TEST_E2E_FILES + FE_TEST_UNIT_FILES + FE_TEST_E2E_FILES))

      # === Build PR comment markdown ===
      cat > /tmp/pr_comment.md << 'HEADER'
      <!-- pr-summary -->
      ## PR Change Summary

      ### Production Code Changes
      HEADER

      cat >> /tmp/pr_comment.md << EOF
      | Category | Files | Lines Added | Lines Removed |
      |----------|------:|------------:|--------------:|
      | **Backend (Python)** | ${BE_PROD_FILES} | +${BE_PROD_ADD} | -${BE_PROD_DEL} |
      | **Frontend (JS/React)** | ${FE_PROD_FILES} | +${FE_PROD_ADD} | -${FE_PROD_DEL} |
      | **Total Production** | **${TOTAL_PROD_FILES}** | **+${TOTAL_PROD_ADD}** | **-${TOTAL_PROD_DEL}** |

      ### Testing Code Changes

      | Category | Files | Lines Added | Lines Removed |
      |----------|------:|------------:|--------------:|
      | Backend Unit | ${BE_TEST_UNIT_FILES} | +${BE_TEST_UNIT_ADD} | -${BE_TEST_UNIT_DEL} |
      | Backend Integration | ${BE_TEST_INT_FILES} | +${BE_TEST_INT_ADD} | -${BE_TEST_INT_DEL} |
      | Backend E2E/Sandbox | ${BE_TEST_E2E_FILES} | +${BE_TEST_E2E_ADD} | -${BE_TEST_E2E_DEL} |
      | Frontend Unit | ${FE_TEST_UNIT_FILES} | +${FE_TEST_UNIT_ADD} | -${FE_TEST_UNIT_DEL} |
      | Frontend E2E | ${FE_TEST_E2E_FILES} | +${FE_TEST_E2E_ADD} | -${FE_TEST_E2E_DEL} |
      | **Total Testing** | **${TOTAL_TEST_FILES}** | **+${TOTAL_TEST_ADD}** | **-${TOTAL_TEST_DEL}** |
      EOF

      if [ "$OTHER_FILES" -gt 0 ]; then
        cat >> /tmp/pr_comment.md << EOF

      > **Other files** (config, docs, scripts): ${OTHER_FILES} files (+${OTHER_ADD} / -${OTHER_DEL})
      EOF
      fi

      # === Coverage gap section ===
      if [ -n "$PY_COVERAGE_ROWS" ] || [ -n "$JS_COVERAGE_ROWS" ]; then
        cat >> /tmp/pr_comment.md << 'COVSECTION'

      ### Unit Test Coverage — Changed Production Files
      COVSECTION

        if [ -n "$PY_COVERAGE_ROWS" ]; then
          cat >> /tmp/pr_comment.md << EOF

      **Backend (Python)**
      | File | Line Coverage | Status |
      |------|-------------:|--------|
      ${PY_COVERAGE_ROWS}
      EOF
        fi

        if [ -n "$JS_COVERAGE_ROWS" ]; then
          cat >> /tmp/pr_comment.md << EOF

      **Frontend (JS/React)**
      | File | Line Coverage | Status |
      |------|-------------:|--------|
      ${JS_COVERAGE_ROWS}
      EOF
        fi
      fi

      cat >> /tmp/pr_comment.md << 'FOOTER'

      ---
      <sub>Generated by PR Summary workflow</sub>
      FOOTER

      # === Post or update the PR comment using marker ===
      COMMENT_ID=$(gh api "repos/visivo-io/visivo/issues/${{ init.pr-num }}/comments" \
        --jq '.[] | select(.body | contains("<!-- pr-summary -->")) | .id' 2>/dev/null | head -1)

      if [ -n "$COMMENT_ID" ]; then
        gh api "repos/visivo-io/visivo/issues/comments/${COMMENT_ID}" \
          -X PATCH \
          -F "body=@/tmp/pr_comment.md"
      else
        gh pr comment ${{ init.pr-num }} -F /tmp/pr_comment.md
      fi
    env:
      GH_TOKEN: ${{ vaults.default.github-apps.mint-automation-visivo.token }}
