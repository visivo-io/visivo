- path: /api/project/load_example/
  verbs:
  - POST
  serves:
  - studio
  reason: 'Local onboarding only: writes an example project to disk. The cloud creates projects through /api/projects/draft/.'

# Flask /api/ routes the viewer never calls but that still need tracking, each
# with who calls it.
server_only:
- path: /api/mcp/
  reason: The MCP endpoint external clients POST to. The viewer only renders its
    URL for a person to paste into a client config; it never requests it. Cloud
    will serve the same shape (VIS-1665).
- path: /api/auth/authorize-device-token/callback/{}/
  reason: Where the browser lands at the end of `visivo authorize`. The cloud
    sign-in page redirects here; no viewer code calls it.
- path: /api/agent/
  reason: Unversioned alias of the agentSessions entry.
- path: /api/agent/{}/
  reason: Unversioned alias of the agentSession entry.
- path: /api/agent/{}/cancel/
  reason: Unversioned alias of the agentSessionCancel entry.
- path: /api/agent/actions/
  reason: Unversioned alias of the agentActions entry.
- path: /api/agent/captures/{}.png
  reason: Serves a screenshot the agent captured. Referenced by URL from inside
    a transcript, not fetched through the registry.
- path: /api/projects/{}/agent/captures/{}.png
  reason: Project-scoped form of the capture path above.
- path: /api/models/{}/profile/
  reason: The agent's profiling tools. The viewer profiles locally in DuckDB.
- path: /api/models/{}/histogram/{}/
  reason: As above — the viewer's column histogram comes from
    `histogramTableLocally`, never from the server.
- path: /api/files/{}/
  reason: Data by content hash. The CLI reads these during `visivo deploy`.
- path: /api/files/{}/{}/
  reason: Run-scoped form of the path above.
- path: /api/source/create/
  reason: Legacy onboarding route. Onboarding now saves sources as drafts through
    sourceDetail. VIS-1266 removes it.
- path: /api/source/upload/
  reason: Legacy onboarding upload. Onboarding now uploads through
    projectFileUploads. VIS-1266 removes it.
- path: /api/project/finalize/
  reason: Legacy onboarding route that rewrote project.visivo.yml. Nothing calls
    it since onboarding saves drafts. VIS-1266 removes it.
