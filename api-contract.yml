literals:
- path: /api/auth/status/
  verbs:
  - GET
  serves:
  - studio
  - cloud
- path: /api/auth/authorize-device-token/
  verbs:
  - POST
  serves:
  - studio
  reason: Local device-auth handshake with the cloud; a cloud session is already signed in.
- path: /api/cloud/job/status/${authId}/
  verbs:
  - GET
  serves:
  - studio
  cloud_equivalent: /api/runs/{id}/
- path: /api/${segmentFor(type)}/${encodeURIComponent(name)}/restore/
  verbs: []
  serves:
  - studio
  cloud_equivalent: /api/<type>/{name}/restore/ (one route per object type)
- path: /api/cloud/branches/
  verbs:
