# API contract between the viewer and the two servers that host it.
#
# The viewer (viewer/src) is served by `visivo serve` (Flask, surface `studio`), by Visivo Cloud
# (Django, surface `cloud`) and as a static export (`dist`). Every path the viewer can request is
# listed here, keyed by its name in viewer/src/config/urls.js. `literals` holds the paths that
# bypass the registry; prefer adding a key and moving the call to the registry.
#
# Fields: path (template), verbs (what the viewer sends), serves (which surfaces answer),
# cloud_equivalent or reason (required when studio serves a path and the cloud does not).
#
# Checked by tests/server/test_api_contract.py here and by the cloud's parity test. The check fails
# on a viewer path with no entry, a `cloud` claim the cloud routes do not honor, a `studio` claim
# the Flask routes do not honor, a studio-only entry with no equivalent and no reason, and an
# entry that nothing references. Generated route tables are never committed.
