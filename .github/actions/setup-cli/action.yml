name: Set up the CLI
description: Installs Python and uv, and restores the cached virtualenv.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version-file: .python-version
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cache/uv
          .venv
        key: py-${{ runner.os }}-${{ hashFiles('.python-version', 'uv.lock', 'pyproject.toml') }}
    - shell: bash
      run: pip install uv
