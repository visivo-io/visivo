name: nightly_chain

on:
  schedule:
    - cron: "0 7 * * *"
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      force:
        description: Start the RWX run even if this commit already passed
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: nightly_chain-${{ github.ref }}

jobs:
  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check for a commit the chain has not passed
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || github.event_name == 'push' }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly_chain.yml/runs?branch=$GITHUB_REF_NAME&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
          if [ "$passed" != "$GITHUB_SHA" ] || [ "$FORCE" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "The last successful run already covered $GITHUB_SHA"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the RWX CLI
        if: steps.pending.outputs.run == 'true'
        run: |
          curl -fsSL https://github.com/rwx-cloud/rwx/releases/download/v3.36.1/rwx-linux-x86_64 -o "$RUNNER_TEMP/rwx"
          chmod +x "$RUNNER_TEMP/rwx"

      - name: Run the integration chain on RWX
        if: steps.pending.outputs.run == 'true'
        env:
          RWX_ACCESS_TOKEN: ${{ secrets.RWX_ACCESS_TOKEN }}
        run: '"$RUNNER_TEMP/rwx" dispatch visivo-test-chain --ref "$GITHUB_REF_NAME" --wait'

      - name: Post the failure to Slack
        if: (failure() || cancelled()) && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$SLACK_WEBHOOK_URL" ] || exit 0
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"The RWX integration chain did not pass on $GITHUB_REF_NAME: $RUN_URL\"}" "$SLACK_WEBHOOK_URL"
