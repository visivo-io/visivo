name: Spike test_visivo timing

on:
  push:
    branches: [spike/gha-test-visivo]

env:
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  STACKTRACE: "true"

jobs:
  test-cli:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            .venv
          key: py-${{ runner.os }}-${{ hashFiles('.python-version', 'poetry.lock', 'pyproject.toml') }}
      - run: pip install poetry
      - run: poetry install --with dev --no-root
      - run: poetry install --with dev
      - run: poetry run pytest --json-report --cov=visivo --cov-report=json:coverage-python.json

  lint-cli:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            .venv
          key: py-${{ runner.os }}-${{ hashFiles('.python-version', 'poetry.lock', 'pyproject.toml') }}
      - run: pip install poetry
      - run: poetry install --with dev --no-root
      - run: poetry run black --check . --target-version py312

  viewer-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v6
      - id: marker
        uses: actions/cache/restore@v4
        with:
          path: .pass-marker
          key: pass-viewer-test-${{ hashFiles('viewer/**', '!viewer/node_modules/**', 'visivo/**') }}
          lookup-only: true
      - uses: actions/setup-node@v6
        if: steps.marker.outputs.cache-hit != 'true'
        with:
          node-version-file: viewer/.nvmrc
      - uses: actions/cache@v4
        if: steps.marker.outputs.cache-hit != 'true'
        with:
          path: viewer/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('viewer/.nvmrc', 'viewer/package.json', 'viewer/yarn.lock') }}
      - if: steps.marker.outputs.cache-hit != 'true'
        working-directory: viewer
        run: yarn install
      - if: steps.marker.outputs.cache-hit != 'true'
        working-directory: viewer
        run: >
          yarn test --maxWorkers=2 --workerIdleMemoryLimit=512MB
          --json --testLocationInResults --outputFile jest.json
          --coverage --coverageReporters=json-summary
          --coverageDirectory=../coverage-js
      - if: steps.marker.outputs.cache-hit != 'true'
        run: mkdir -p .pass-marker && touch .pass-marker/ok
      - if: steps.marker.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .pass-marker
          key: ${{ steps.marker.outputs.cache-primary-key }}

  viewer-test-4-workers:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: viewer/.nvmrc
      - uses: actions/cache@v4
        with:
          path: viewer/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('viewer/.nvmrc', 'viewer/package.json', 'viewer/yarn.lock') }}
      - working-directory: viewer
        run: yarn install
      - working-directory: viewer
        run: >
          yarn test --maxWorkers=4 --workerIdleMemoryLimit=1500MB
          --json --testLocationInResults --outputFile jest.json
          --coverage --coverageReporters=json-summary
          --coverageDirectory=../coverage-js

  viewer-lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - id: marker
        uses: actions/cache/restore@v4
        with:
          path: .pass-marker
          key: pass-viewer-lint-${{ hashFiles('viewer/**', '!viewer/node_modules/**') }}
          lookup-only: true
      - uses: actions/setup-node@v6
        if: steps.marker.outputs.cache-hit != 'true'
        with:
          node-version-file: viewer/.nvmrc
      - uses: actions/cache@v4
        if: steps.marker.outputs.cache-hit != 'true'
        with:
          path: viewer/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('viewer/.nvmrc', 'viewer/package.json', 'viewer/yarn.lock') }}
      - if: steps.marker.outputs.cache-hit != 'true'
        working-directory: viewer
        run: yarn install
      - if: steps.marker.outputs.cache-hit != 'true'
        working-directory: viewer
        run: |
          yarn run lint --max-warnings=0
          yarn run prettier --check
      - if: steps.marker.outputs.cache-hit != 'true'
        run: mkdir -p .pass-marker && touch .pass-marker/ok
      - if: steps.marker.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .pass-marker
          key: ${{ steps.marker.outputs.cache-primary-key }}
