name: Build & Deploy Docs Examples Site
on:
  workflow_call:
    inputs:
      ref:
        description: "The release tag to build from"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "The release tag to build from, e.g. v1.2.3"
        required: true
        type: string

permissions:
  contents: read
jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"

      - name: Install visivo
        run: |
          python -m pip install "git+https://github.com/visivo-io/visivo.git@${{ inputs.ref }}"

      - name: Install and Build
        run: |
          cd test-projects/docs-examples
          visivo compile
          visivo run
          visivo dist
          cd ../..

      - name: Deploy to Netlify via CLI
        run: |
          cd test-projects/docs-examples/dist
          npm install -g netlify-cli@latest
          ls -la
          ls assets
          netlify deploy --prod --dir . --auth "$NETLIFY_AUTH_TOKEN" --site "$NETLIFY_SITE_ID"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 283d65f3-f89a-4a70-a44c-a3ee4cb297d0
