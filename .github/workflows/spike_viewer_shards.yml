name: Spike viewer shards

on:
  push:
    branches: [spike/gha-test-visivo]

env:
  NODE_OPTIONS: --max-old-space-size=2048

jobs:
  shards:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { total: 2, shard: 1 }
          - { total: 2, shard: 2 }
          - { total: 3, shard: 1 }
          - { total: 3, shard: 2 }
          - { total: 3, shard: 3 }
          - { total: 4, shard: 1 }
          - { total: 4, shard: 2 }
          - { total: 4, shard: 3 }
          - { total: 4, shard: 4 }
    name: shard ${{ matrix.shard }} of ${{ matrix.total }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: viewer/.nvmrc
      - uses: actions/cache@v4
        with:
          path: viewer/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('viewer/.nvmrc', 'viewer/package.json', 'viewer/yarn.lock') }}
      - working-directory: viewer
        run: yarn install
      - working-directory: viewer
        run: >
          yarn test --maxWorkers=4 --workerIdleMemoryLimit=1500MB
          --shard=${{ matrix.shard }}/${{ matrix.total }}
          --json --testLocationInResults --outputFile jest.json
          --coverage --coverageReporters=json
          --coverageDirectory=../coverage-js
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.total }}-${{ matrix.shard }}
          retention-days: 3
          path: |
            viewer/jest.json
            coverage-js/coverage-final.json

  merge:
    needs: shards
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        total: [2, 3, 4]
    name: merge ${{ matrix.total }} shards
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: viewer/.nvmrc
      - uses: actions/cache@v4
        with:
          path: viewer/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('viewer/.nvmrc', 'viewer/package.json', 'viewer/yarn.lock') }}
      - working-directory: viewer
        run: yarn install
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-${{ matrix.total }}-*
          path: shards
      - name: Merge coverage and count tests
        working-directory: viewer
        run: |
          node -e "
          const fs = require('fs'), path = require('path');
          const lc = require('istanbul-lib-coverage'), lr = require('istanbul-lib-report'), rp = require('istanbul-reports');
          const root = '../shards', map = lc.createCoverageMap({});
          const totals = { suites: 0, tests: 0, passed: 0, failed: 0, pending: 0 };
          for (const d of fs.readdirSync(root)) {
            const j = JSON.parse(fs.readFileSync(path.join(root, d, 'viewer/jest.json')));
            totals.suites += j.numTotalTestSuites; totals.tests += j.numTotalTests;
            totals.passed += j.numPassedTests; totals.failed += j.numFailedTests; totals.pending += j.numPendingTests;
            map.merge(JSON.parse(fs.readFileSync(path.join(root, d, 'coverage-js/coverage-final.json'))));
          }
          const ctx = lr.createContext({ dir: '../merged', coverageMap: map });
          rp.create('json-summary').execute(ctx);
          const s = JSON.parse(fs.readFileSync('../merged/coverage-summary.json')).total;
          console.log('SPIKE_RESULT ' + JSON.stringify({ totals, lines: s.lines.pct, statements: s.statements.pct, branches: s.branches.pct, functions: s.functions.pct }));
          "
