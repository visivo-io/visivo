name: Deploy Dashboard

on:
  pull_request:
    types:
      - opened
      - reopened
      - closed
      - synchronize
env:
  yml_location: test-projects/integration
  visivo_version: ${{ github.head_ref }}
  stage_name: ${{ github.head_ref }}

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"

      - name: Sanitize Stage Name
        run: |
          SANITIZED_STAGE_NAME=$(echo "${{ env.stage_name }}" | sed 's|[/.-]|_|g')
          echo "SANITIZED_STAGE_NAME=$SANITIZED_STAGE_NAME" >> $GITHUB_ENV
          echo "Sanitized stage name: $SANITIZED_STAGE_NAME"

      - name: Deploy
        id: deploy
        if: github.event.pull_request.merged == false && github.event.pull_request.closed_at == null
        # Not secrets — these are the passwords of the throwaway local
        # containers the integration project points at, and they are already
        # in plain sight in docker-compose.yml and .rwx/test_visivo.yml. They
        # live here rather than in the project YAML because core rejects a
        # source config carrying a literal credential: it would be stored in
        # Postgres, returned by GET /api/sources/, and copied into every
        # branch. The CLI also masks a literal SecretStr as `**********`, so
        # the value that reached the server was never the real one anyway.
        env:
          CLICKHOUSE_PASSWORD: clickhouse
          LOCAL_SNOWFLAKE_PASSWORD: test
        run: |
          python -m pip install git+https://github.com/visivo-io/visivo.git@${{ env.visivo_version }}
          cd ${{ env.yml_location }}
          echo "Running visivo run"
          visivo run 
          echo "Running visivo deploy"
          VISIVO_TOKEN=${{ secrets.VISIVO_DEVELOPMENT_TOKEN }} visivo deploy -s ${SANITIZED_STAGE_NAME}-actions --host https://app.development.visivo.io \
            | tee /dev/stderr | grep 'Deployed to: ' > deployed.txt
          deployed=$(cat deployed.txt)
          echo "deployed=$deployed" >> "$GITHUB_OUTPUT"

      - name: Comment
        if: github.event.pull_request.merged == false && github.event.pull_request.closed_at == null
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          message: |
            Visivo Dashboard:
             ${{ steps.deploy.outputs.deployed}}
      - name: Archive
        if: github.event.pull_request.merged == true || github.event.pull_request.closed_at != null
        run: |
          python -m pip install git+https://github.com/visivo-io/visivo.git@${{ github.base_ref }}
          VISIVO_TOKEN=${{ secrets.VISIVO_DEVELOPMENT_TOKEN }} visivo archive -s ${SANITIZED_STAGE_NAME}-actions --host https://app.development.visivo.io
