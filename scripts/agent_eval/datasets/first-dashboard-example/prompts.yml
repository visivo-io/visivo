# The first-dashboard path (VIS-1806), route 1: the Example. These are the
# prompt chips the agent tab offers on the EV Sales example
# (viewer/src/components/agentStarterPrompts.json). A test keeps the two
# lists equal, so a chip only ships after it is scored here.
name: first-dashboard-example
project: visivo/templates/samples/ev-sales
description: >-
  The EV Sales example: one DuckDB table, ev_sales (60 rows: quarter 2022Q1 to
  2024Q2, region North America / Europe / APAC, powertrain BEV / PHEV,
  units_sold, revenue_usd), an ev_sales model, five insights and charts, and
  the EV Sales Overview dashboard.
pass_bar:
  example: 3
prompts:
  - id: example-revenue
    route: example
    chip: true
    dashboard: revenue-by-region
    prompt: >-
      Build a dashboard called revenue-by-region with total revenue at the
      top and revenue by region for each quarter below it.
    expects: [answers_question, kpi_row, reuses_existing_model]
    truth: >-
      Total revenue is sum(revenue_usd) over all 60 rows. The example already
      has an ev_sales model; a second model of the same table is a defect.

  - id: example-powertrain
    route: example
    chip: true
    dashboard: powertrain-growth
    prompt: >-
      Which powertrain is growing faster? Build a dashboard called
      powertrain-growth with units sold per quarter, split by powertrain.
    expects: [answers_question, split_by_powertrain, reuses_existing_model]

  - id: example-region-picker
    route: example
    chip: true
    dashboard: region-explorer
    prompt: >-
      Build a dashboard called region-explorer where I pick a region and see
      units sold and revenue by quarter for it.
    expects: [inputs, inputs_wired, reuses_existing_model]
