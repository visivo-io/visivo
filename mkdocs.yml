site_name: Visivo Docs
site_url: https://docs.visivo.io
site_description: Documentation for Visivo, the AI-native open-source BI-as-code platform.
  Define data sources, a semantic layer of metrics, dimensions, and relations, and
  dashboards as version-controlled YAML, then explore them interactively with Insights.
  Develop locally with visivo serve and deploy to Visivo Cloud.
site_author: Visivo
plugins:
  - mkdocs-video
  - autolinks
  - search: {}
  - macros:
      module_name: mkdocs/src/main
      on_error_fail: true
      on_undefined: strict
  - spellcheck:
      backends:
        - codespell:
            dictionaries:
              - clear
              - rare
      known_words: known_words.txt
      ignore_code: true
      min_length: 2
      max_capital: 1
  - include-markdown:
      opening_tag: '{!'
      closing_tag: '!}'
      comments: false
markdown_extensions:
  - mkdocs-click
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid-vz
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - abbr
  - pymdownx.snippets
  - md_in_html
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - mkdocs/overrides/.icons
repo_url: https://github.com/visivo-io/visivo
repo_name: visivo-io/visivo
edit_uri: edit/main/mkdocs/
theme:
  name: material
  custom_dir: mkdocs/overrides
  font: false
  features:
    - content.tabs.link
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.prune
    - navigation.top
    - navigation.path
    - navigation.tracking
    - navigation.instant
    - navigation.footer
    - toc.follow
    - content.action.edit
    - content.tooltips
    - content.code.annotate
    - content.code.copy
  logo: assets/favicon_io/android-chrome-192x192.png
  favicon: assets/favicon_io/favicon-32x32.png
  icon:
    annotation: material/arrow-right-circle
    repo: fontawesome/brands/github
    edit: material/pencil
    previous: material/chevron-left
    next: material/chevron-right
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: visivo_light
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: visivo_dark
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
docs_dir: mkdocs
site_dir: mkdocs_build
extra:
  analytics:
    provider: combined
    property: G-50DF3C95TL
extra_css:
  - stylesheets/brand_colors.css
  - stylesheets/icon-colors.css
  - stylesheets/extra.css
extra_javascript:
  - javascripts/mermaid-init.js
