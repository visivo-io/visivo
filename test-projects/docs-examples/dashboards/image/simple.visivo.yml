charts:
  - name: simple-image-chart
    layout:
      title:
        text: Simple Image Plot<br><sub>Raster Image Display</sub>
    insights:
      - ${ref(simple-image-plot)}
insights:
  # An image is a grid of pixels, each pixel an array of colour channels
  # (rgb by default). The grid is inlined here: an insight whose props are all
  # static needs no model — it has no data job and renders from the props alone.
  - name: simple-image-plot
    props:
      type: image
      z:
        - [[0, 0, 0], [255, 255, 255], [0, 0, 0], [255, 255, 255]]
        - [[255, 255, 255], [0, 0, 0], [255, 255, 255], [0, 0, 0]]
        - [[0, 0, 0], [255, 255, 255], [0, 0, 0], [255, 255, 255]]
