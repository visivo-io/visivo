sources:
  - name: image-pixels-source
    type: duckdb
    database: target/seeds/image_pixels.duckdb
    seeds:
      - table_name: pixels
        args:
          - echo
          - |
            row,col,r,g,b
            0,0,210,89,70
            0,1,113,59,87
            0,2,210,89,70
            0,3,113,59,87
            1,0,113,59,87
            1,1,236,239,203
            1,2,113,59,87
            1,3,236,239,203
            2,0,210,89,70
            2,1,113,59,87
            2,2,210,89,70
            2,3,113,59,87
models:
  - name: image-pixel-rows
    source: ${ref(image-pixels-source)}
    sql: select row, list([r, g, b] order by col) as pixels from pixels where row is not null group by row
charts:
  - name: image-plot-from-query
    layout:
      title:
        text: Image From a Query<br><sub>Pixel Rows Built With list()</sub>
    insights:
      - ${ref(image-from-query-plot)}
insights:
  - name: image-from-query-plot
    props:
      type: image
      z: ?{${ref(image-pixel-rows).pixels}}
    interactions:
      - sort: ?{${ref(image-pixel-rows).row} ASC}
