# Regenerated by the agent's tools only (VIS-1451): profile_model, recommend_charts,
# recommend_inputs (region and channel wired to every insight), recommend_layout,
# write_*, preview_insight and validate_dashboard; no hand edits beyond KPI `[0]`.
inputs:
- name: channel
  type: single-select
  label: Channel
  options:
  - Online
  - Store
  - Wholesale
  display:
    type: tabs
    default:
      value: Online
- name: region
  type: single-select
  label: Region
  options:
  - East
  - North
  - South
  - West
  display:
    type: tabs
    default:
      value: East
insights:
- name: sales_total_revenue
  props:
    type: indicator
    mode: number
    value: ?{ sum(${ref(sales_data).revenue}) }[0]
    number:
      valueformat: $,.0f
    title:
      text: Revenue
  interactions:
  - filter: ?{ ${ref(sales_data).channel} = '${ref(channel).value}' }
  - filter: ?{ ${ref(sales_data).region} = '${ref(region).value}' }
- name: sales_total_units
  props:
    type: indicator
    mode: number
    value: ?{ sum(${ref(sales_data).units_sold}) }[0]
    number:
      valueformat: ',.0f'
    title:
      text: Units sold
  interactions:
  - filter: ?{ ${ref(sales_data).channel} = '${ref(channel).value}' }
  - filter: ?{ ${ref(sales_data).region} = '${ref(region).value}' }
- name: sales_revenue_by_category
  props:
    type: bar
    x: ?{ ${ref(sales_data).category} }
    y: ?{ sum(${ref(sales_data).revenue}) }
  interactions:
  - sort: ?{ sum(${ref(sales_data).revenue}) DESC }
  - filter: ?{ ${ref(sales_data).channel} = '${ref(channel).value}' }
  - filter: ?{ ${ref(sales_data).region} = '${ref(region).value}' }
- name: sales_revenue_by_quarter
  props:
    type: bar
    x: ?{ ${ref(sales_data).quarter} }
    y: ?{ sum(${ref(sales_data).revenue}) }
  interactions:
  - sort: ?{ ${ref(sales_data).quarter} ASC }
  - filter: ?{ ${ref(sales_data).channel} = '${ref(channel).value}' }
  - filter: ?{ ${ref(sales_data).region} = '${ref(region).value}' }
charts:
- name: total_revenue_chart
  insights:
  - ${ref(sales_total_revenue)}
  layout: {}
- name: total_units_chart
  insights:
  - ${ref(sales_total_units)}
  layout: {}
- name: revenue_by_category_chart
  insights:
  - ${ref(sales_revenue_by_category)}
  layout:
    yaxis:
      tickformat: $,.0f
      title:
        text: Revenue ($)
    title:
      text: Revenue by category
- name: revenue_by_quarter_chart
  insights:
  - ${ref(sales_revenue_by_quarter)}
  layout:
    yaxis:
      tickformat: $,.0f
      title:
        text: Revenue ($)
    title:
      text: Revenue by quarter
tables:
- name: sales_detail_table
  rows_per_page: 25
  columns:
  - ${ref(sales_data).region} as "Region"
  - ${ref(sales_data).quarter} as "Quarter"
  - ${ref(sales_data).category} as "Category"
  - ${ref(sales_data).channel} as "Channel"
  - ${ref(sales_data).revenue} as "Revenue ($)"
  - ${ref(sales_data).units_sold} as "Units"
dashboards:
- name: agent-regenerated
  level: 0
  tags: []
  type: internal
  rows:
  - height: compact
    items:
    - width: 12
      markdown:
        content: '**Controls** — channel, region filter every chart on this page.'
        align: left
        justify: start
  - height: compact
    items:
    - width: 6
      input: ${ref(channel)}
    - width: 6
      input: ${ref(region)}
  - height: compact
    items:
    - width: 12
      markdown:
        content: '# Sales overview'
        align: left
        justify: start
  - height: xsmall
    items:
    - width: 6
      chart: ${ref(total_revenue_chart)}
    - width: 6
      chart: ${ref(total_units_chart)}
  - height: compact
    items:
    - width: 12
      markdown:
        content: '## The main picture

          Look for the overall shape before the breakdowns.'
        align: left
        justify: start
  - height: large
    items:
    - width: 12
      chart: ${ref(revenue_by_category_chart)}
  - height: medium
    items:
    - width: 12
      chart: ${ref(revenue_by_quarter_chart)}
  - height: compact
    items:
    - width: 12
      markdown:
        content: '## Detail

          The rows behind the charts, for looking a value up.'
        align: left
        justify: start
  - height: large
    items:
    - width: 12
      table: ${ref(sales_detail_table)}
