[project]
name = "dbt-visivo"
version = "0.1.0"
description = "dbt project used by visivo's dbt integration lane"
requires-python = ">=3.10,<3.13"
readme = "README.md"
dependencies = [
    "dbt-core>=1.8,<2.0.0",
    "dbt-duckdb>=1.8,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Nothing to package: this project exists to be run by dbt, not installed.
bypass-selection = true
