type: scattergeo
family: geo_point
status: preferred
one_liner: Points on an outline map (no tiles) from lat/lon or country/state codes; for world and continent scope.
use_when:
  - "`geo_point` rows spread across countries or continents (offices, shipments, airports) where street tiles add nothing."
  - "A `geo_region` column of countries or US states and the metric reads better as a sized bubble than a fill: `locations` + `locationmode`, no lat/lon needed."
  - The dashboard must render without a tile server (offline, export, a print-friendly figure).
other_uses:
  - use: Route or flow map between origins and destinations (shipping lanes, flight routes).
    how: "`mode: lines`, two rows per route (origin and destination lat/lon), `split` on the route id and `- sort:` on the leg order; `line.width` from a scaled count for volume."
avoid_when:
  - "City-scale points (NYC pickups, one metro area): the outline map has no streets; use `scattermap`."
  - Too many points for an SVG trace with no clustering; aggregate, or use `densitymap`.
  - "'How much per region' with built-in boundaries; a `choropleth` fills the region instead of guessing its centroid."
  - Custom regions (zones, counties); `locationmode` only knows countries and US states, so use `scattermap` on centroids.
data_shape:
  metrics: {min: 0, max: 2}
  dimensions: {min: 1, max: 3}
  dimension_roles: [geo_point, geo_region, categorical, boolean]
  rows: {max: 3000}
required_props: [lat, lon]
example: |
  insights:
    - name: orders-by-city
      props:
        type: scattergeo
        lat: ?{ avg(${ref(orders).ship_lat}) }
        lon: ?{ avg(${ref(orders).ship_lon}) }
        text: ?{ ${ref(orders).ship_city} }
        mode: markers
        marker:
          size: ?{ sqrt(count(*)) }
  charts:
    - name: orders-map
      layout: {geo: {scope: world, projection: {type: natural earth}}}
      insights:
        - ${ref(orders-by-city)}
variations:
  - when: "the data has no lat/lon but has countries or US states"
    then: "`locations` + `locationmode` (`ISO-3`, `USA-states`, `country names`); bubbles sit on the region centroid"
  - when: "a metric per place"
    then: "`marker.size` from `sqrt(count)` with `marker.sizemode: diameter`, scaled into ~6–40 px"
  - when: "a categorical with 2–7 values"
    then: "`split` (theme-colored series), not `marker.color`"
  - when: "the points cover one country or continent"
    then: "chart `layout.geo.scope` and `layout.geo.projection.type`, or `layout.geo.fitbounds: locations` to zoom to the data"
limits:
  series_ideal: 5
  series_max: 8
  repair: [top_n_other, input_filter, densitymap]
transforms: [aggregate_to_centroid, top_n_other]
gotchas:
  - "`layout.geo` lives on the chart, not the insight: without `scope` or `fitbounds: locations` a US-only dataset is drawn as a smudge on a world map."
  - "`locationmode` must match the column (`ISO-3` is the default); mismatched codes drop the points silently, as in choropleth."
  - "The theme colors `layout.geo` land, ocean and borders; do not override `landcolor` or `bgcolor` per chart or dark mode breaks."
  - "`marker.color` as hex strings from a CASE gives each series a fixed colour; a numeric column needs `marker.colorscale` instead."
  - "`mode: lines` connects points in row order: add `- sort:` on the sequence column and one `split` per route, or every point is joined into one zig-zag."
pairings: [chart_beside(bar), detail_table_below, kpi_strip_above]
layout: {height: large, width_share: 0.67, row_role: hero}
mobile: "Full width, `large`; set `layout.geo.fitbounds: locations` so the data, not the whole globe, fills the narrow frame."
