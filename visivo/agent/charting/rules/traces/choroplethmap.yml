type: choroplethmap
family: geo_region
status: preferred
one_liner: Color arbitrary regions from a GeoJSON on a tiled street map; the choropleth for custom boundaries.
use_when:
  - "A `geo_region` column with `geo_kind: custom` and `semantics.boundaries_available`: a GeoJSON URL whose feature ids match the column (zones, counties, districts)."
  - The reader needs street-level context (a tiled basemap) under the regions.
  - "`intent: geo` with regions smaller than a US state."
other_uses:
  - use: Change map that splits zones into growth and decline around zero, e.g. trips versus last month by zone.
    how: "`z: ?{ <current> - <prior> }`, a diverging `colorscale` such as `RdBu`, and `zmid: 0`."
avoid_when:
  - "No GeoJSON is available; fall back to a bar or heatmap by region, or `scattermap` on centroid lat/lon."
  - Built-in boundaries suffice (countries, US states); `choropleth` needs no file and no network fetch.
  - Too many features for the browser to fetch and draw every polygon; simplify or aggregate.
  - Comparing exact values; pair with a sorted bar or a table.
data_shape:
  metrics: {min: 1, max: 1}
  dimensions: {min: 1, max: 1}
  dimension_roles: [geo_region]
  cardinality: {min: 3, max: 2000}
required_props: [geojson, locations, z]
example: |
  insights:
    - name: rides-by-zone
      props:
        type: choroplethmap
        geojson: https://example.com/taxi_zones.geojson
        featureidkey: properties.zone_id
        locations: ?{ ${ref(trips).pickup_zone_id} }
        z: ?{ count(*) }
        colorscale: Blues
        reversescale: true
        marker: {opacity: 0.75}
  charts:
    - name: rides-by-zone-map
      insights: ["${ref(rides-by-zone)}"]
      layout: {map: {center: {lat: 40.73, lon: -73.94}, zoom: 9.5}}
variations:
  - when: "the regions cover one city or area"
    then: "chart `layout.map.center` and `layout.map.zoom`; the theme sets `layout.map.style`"
  - when: "a second metric matters"
    then: "`text` + `hovertemplate`; opacity and color are the only visual channels"
  - when: "the reader compares regions across periods"
    then: "an input that filters the period; never one map per period"
limits:
  series_ideal: 1
  series_max: 1
  repair: [dominant_category, input_filter]
transforms: [rate_per_capita]
gotchas:
  - "`featureidkey` must point at the GeoJSON property that holds the same values as `locations` (default `id`); a mismatch renders the basemap with no regions and no error."
  - "`geojson` is a URL the browser fetches: it must be public and CORS-enabled; a local file path does not work in a deployed dashboard."
  - "Use `choroplethmap`, not `choroplethmapbox`; the mapbox traces are deprecated and need an access token, while the `*map` traces use MapLibre with the theme's carto style."
  - "Set `layout.map.center` and `layout.map.zoom`; the default view is the whole world."
  - "One row per location (aggregate in SQL); duplicate locations overdraw."
pairings: [chart_beside(bar), detail_table_below]
layout: {height: large, width_share: 0.67, row_role: hero}
mobile: "Full width, `large`; drop the colorbar (`showscale: false`) below 1024 px."
