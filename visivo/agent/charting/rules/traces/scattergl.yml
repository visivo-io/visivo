type: scattergl
family: line
secondary_families: [xy]
status: preferred
one_liner: WebGL scatter; the repair target when a scatter has too many points for SVG.
use_when:
  - "Any `scatter` case (line or markers) with too many points for SVG, even after aggregation."
  - Dense x/y clouds (fare vs distance over every trip) where seeing the shape matters more than hovering a point.
avoid_when:
  - Few enough points for plain `scatter`, which renders crisper text and supports every prop.
  - "Stacked areas; scattergl has no `stackgroup`, so aggregate and use `scatter`."
  - Dashboards with many charts; each WebGL context costs memory and browsers cap them at ~8–16.
  - Printing or export; WebGL canvases rasterize.
data_shape:
  metrics: {min: 1, max: 2}
  dimensions: {min: 1, max: 2}
  dimension_roles: [time, numeric_continuous, numeric_discrete, categorical]
  axis_points: {min: 3}
  rows: {min: 10000}
required_props: [x, y]
example: |
  insights:
    - name: fare-vs-distance
      props:
        type: scattergl
        mode: markers
        x: ?{ ${ref(trips).trip_distance} }
        y: ?{ ${ref(trips).fare_amount} }
        marker: {size: 3, opacity: 0.3}
      interactions:
        - filter: ?{ ${ref(trips).trip_distance} between 0 and 50 }
variations:
  - when: "a second categorical of 2–7 values, or a third numeric measure per point"
    then: "as in scatter: `split` for the categorical, `marker.size` for the numeric"
  - when: "too many points even for WebGL"
    then: "sample in SQL (`using sample 10%`) or bin to a `histogram2d`"
limits:
  series_ideal: 5
  series_max: 8
  repair: [top_n_other, input_filter, histogram2d]
transforms: [sample, clip_p99]
gotchas:
  - "Still ship a bounded result: the browser receives every row, so sample or clip in SQL on large tables."
  - "Set `marker.opacity` well below 1 (0.2–0.4) or a dense cloud is a solid blob."
  - "Hover is coarser than scatter; put the exact figures in a table beside it when they matter."
  - "With `mode: lines`, add `- sort: ?{ <x expression> ASC }`; without it the line connects points in storage order and zig-zags."
pairings: [detail_table_below, chart_beside(histogram)]
layout: {height: medium, width_share: 0.5, row_role: relationship}
mobile: Same as scatter; WebGL on phones is slower, so sample harder than on desktop.
