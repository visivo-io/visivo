type: volume
family: three_d
status: niche
one_liner: Semi-transparent rendering of a scalar on a regular 3D grid (scan, simulation); niche scientific type.
use_when:
  - Only on an explicit request, for one value on every cell of a regular x/y/z grid.
avoid_when:
  - "A metric over three business dimensions (hour × weekday × borough); use a heatmap with an input, or small multiples, for the third."
  - "Scattered or sparse points; volume needs a full grid, use `scatter3d` with `marker.color`."
  - "One level matters; `isosurface` draws that shell crisply instead of a fog."
data_shape:
  metrics: {min: 1, max: 1}
  dimensions: {min: 3, max: 3}
  dimension_roles: [numeric_continuous, numeric_discrete]
  cardinality: {min: 2, max: 50}
required_props: [x, y, z, value]
example: |
  insights:
    - name: density-volume
      props:
        type: volume
        x: ?{ ${ref(grid).x} }
        y: ?{ ${ref(grid).y} }
        z: ?{ ${ref(grid).z} }
        value: ?{ ${ref(grid).value} }
        opacity: 0.1
        surface: {count: 15}
      interactions:
        - sort: ?{ ${ref(grid).idx} ASC }
variations:
  - when: "the reader needs detail inside the cloud"
    then: "`slices.x: {show: true, locations: [...]}` (likewise `y`, `z`) cuts planes through it"
  - when: "low values clutter the view"
    then: "`opacityscale` fades them while high values stay solid"
limits:
  series_ideal: 1
  series_max: 1
  repair: [regrain, heatmap]
transforms: [regrain]
gotchas:
  - "x/y/z must form a complete regular grid; build it in the model SQL (a cross join of axis buckets, value 0 where empty)."
  - "Sort on a grid index column, such as `idx` in the example, so row order is stable."
  - "Set a low `opacity` (0.05–0.2) and a `surface.count` of 10–20; the defaults read as a near-solid block."
  - "Rows grow as the cube of the points per axis, and every one ships to the browser; regrain to a coarser grid first."
pairings: []
layout: {height: large, width_share: 0.5, row_role: relationship}
mobile: Heavy WebGL and touch-hostile rotation; omit on mobile.
