type: mesh3d
family: three_d
status: niche
one_liner: A triangulated 3D mesh from vertices and i/j/k faces; scientific or CAD data only, never a business metric.
use_when:
  - Only on an explicit request, when a table of vertices and triangle indices already exists.
  - "A point cloud to be wrapped in a hull (`alphahull`) when no face table exists."
avoid_when:
  - Any aggregated business metric; a bar or heatmap does every reading of it better.
  - Vertex and face counts differ and cannot be padded into one result set.
  - Meshes with too many faces; the browser receives every vertex as JSON.
data_shape:
  metrics: {min: 3, max: 4}
  dimensions: {min: 1, max: 1}
  dimension_roles: [identifier]
required_props: [x, y, z]
example: |
  insights:
    - name: terrain-mesh
      props:
        type: mesh3d
        x: ?{ ${ref(mesh).x} }
        y: ?{ ${ref(mesh).y} }
        z: ?{ ${ref(mesh).z} }
        i: ?{ ${ref(mesh).i} }
        j: ?{ ${ref(mesh).j} }
        k: ?{ ${ref(mesh).k} }
        intensity: ?{ ${ref(mesh).z} }
      interactions:
        - sort: ?{ ${ref(mesh).idx} ASC }
variations:
  - when: "a numeric value per vertex"
    then: "`intensity` from that column with a `colorscale`"
  - when: "a numeric value per face"
    then: "`intensity` from that column with `intensitymode: cell`"
limits:
  series_ideal: 1
  series_max: 1
  repair: []
transforms: []
gotchas:
  - "i/j/k index into the vertex rows in result order; always `- sort:` on the vertex index, or faces connect the wrong vertices."
  - "All props come from one result set, so vertex and face arrays share a row count; pad the shorter with NULLs in the model SQL."
  - "Any aggregate in a prop triggers a GROUP BY that reorders and dedupes vertices; keep every prop a plain projection."
pairings: []
layout: {height: large, width_share: 0.5, row_role: relationship}
mobile: Rotation fights scroll; acceptable only as a full-width detail row.
