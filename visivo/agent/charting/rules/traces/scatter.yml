type: scatter
family: line
secondary_families: [area, xy]
status: preferred
one_liner: One trace type, three idioms — a line over an ordered axis, a filled area, or x/y markers.
use_when:
  - "A metric over time or any ordered axis (days since signup, step, rank): `mode: lines`."
  - "A few series share the axis: split on the categorical."
  - "Two numeric measures per entity, to see a relationship: `mode: markers`."
  - "Stacked composition over time when the parts are additive: `fill` + `stackgroup`."
other_uses:
  - use: Error bars, e.g. an average with its spread per group or period.
    how: "`mode: markers`, `y: ?{ avg(<m>) }` and `error_y: {type: data, array: ?{ stddev(<m>) }}`."
  - use: A confidence or forecast band around a line.
    how: "A lower-bound insight with `line.width: 0`, then an upper-bound insight with `fill: tonexty` and `line.width: 0`, then the line itself; order them so in `charts.insights`."
  - use: A step line for values that change at points in time (prices, plan tier, inventory).
    how: "`mode: lines` with `line.shape: hv`."
avoid_when:
  - The axis is an unordered categorical; the line implies a sequence that is not there, use bar.
  - Too many series to tell apart; repair with top-N + Other, an input filter, or a heatmap.
  - Too many points for SVG to stay responsive; use scattergl, or aggregate in SQL first.
  - A stacked area of non-additive measures (rates, averages); stacking sums them, which is meaningless.
data_shape:
  metrics: {min: 1, max: 3}
  dimensions: {min: 1, max: 2}
  dimension_roles: [time, numeric_continuous, numeric_discrete, categorical, boolean]
  axis_points: {min: 3}
  rows: {max: 10000}
required_props: [x, y]
example: |
  insights:
    - name: rides-per-day
      props:
        type: scatter
        mode: lines
        x: ?{ date_trunc('day', ${ref(trips).pickup_at}) }
        y: ?{ count(*) }
      interactions:
        - split: ?{ ${ref(trips).company} }
        - sort: ?{ date_trunc('day', ${ref(trips).pickup_at}) ASC }
variations:
  - when: "a second categorical dimension of 2–7 values"
    then: "`split` interaction; one line per value on shared axes"
  - when: "a second metric with a different unit"
    then: "the `bar_line_dual_axis` pairing: the second metric on its own right-hand axis"
  - when: "a third numeric measure per point in markers mode"
    then: "`marker.size` (it scales area, not radius); never `marker.color` unless it encodes data"
  - when: "split markers rather than lines"
    then: "keep fewer series than for lines; overlapping clouds mix colours in the dense core"
  - when: "more series than the theme colorway has colours"
    then: "add colours to the theme `colorway` list, or set the chart's `layout.colorway`; keep at most two very dark colours, which merge as thin lines. The named palettes are no more distinct than the default"
  - when: "too many series for one legend"
    then: "a heatmap (series × axis) keeps every value readable"
limits:
  series_ideal: 8
  series_max: 12
  repair: [top_n_other, input_filter, small_multiples, heatmap]
transforms: [regrain, top_n_other, clip_p99, scattergl]
gotchas:
  - "Always add `- sort: ?{ <x expression> ASC }`; without it the line connects points in storage order and zig-zags."
  - "`x` and `y` must be aggregated at the same grain: `date_trunc('day', ts)` with `count(*)`, never raw rows for a line."
  - "To give a series a fixed colour (a brand colour, or the same one on every dashboard), pin it with a CASE on the split column: `marker.color: ?{ CASE ... END }` for markers, `line.color: \"?{ CASE ... END }[0]\"` for lines. Without the `[0]` the line colour is silently ignored."
  - "A `split` adds a series per distinct value: check the column's cardinality first (up to 7 values is fine, 8–20 needs top-N)."
  - "`fill: tonexty` fills to the previous insight in the chart, so insight order in `charts.insights` is the stacking order; prefer `stackgroup` for stacked areas."
pairings: [indicator_overlay, bar_line_dual_axis, detail_table_below]
layout: {height: medium, width_share: 1.0, row_role: hero}
mobile: Keep fewer series than on desktop and the legend horizontal; a full-width line survives the stack, a half-width one gets too short to read.
