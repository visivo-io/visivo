type: isosurface
family: three_d
status: niche
one_liner: The shells where a gridded 3D scalar crosses chosen values; niche scientific type, never business data.
use_when:
  - Only on an explicit request, for one value on a regular x/y/z grid and a level of interest.
avoid_when:
  - Three business dimensions with a metric; use a heatmap plus an input for the third dimension.
  - "Non-gridded points; there is no surface to extract, use `scatter3d` colored by value."
  - "The whole distribution matters, not one level; `volume` shows the full field."
data_shape:
  metrics: {min: 1, max: 1}
  dimensions: {min: 3, max: 3}
  dimension_roles: [numeric_continuous, numeric_discrete]
  cardinality: {min: 2, max: 50}
required_props: [x, y, z, value]
example: |
  insights:
    - name: density-shell
      props:
        type: isosurface
        x: ?{ ${ref(grid).x} }
        y: ?{ ${ref(grid).y} }
        z: ?{ ${ref(grid).z} }
        value: ?{ ${ref(grid).value} }
        isomin: 2
        isomax: 6
        colorscale: Reds
      interactions:
        - sort: ?{ ${ref(grid).idx} ASC }
variations:
  - when: "the reader needs to see inside the shell"
    then: "`slices.x: {show: true, locations: [...]}` cuts through it and `caps: {x: {show: false}}` opens the ends"
  - when: "several levels matter at once"
    then: "`surface.count` above one draws nested shells between `isomin` and `isomax`"
limits:
  series_ideal: 1
  series_max: 1
  repair: [regrain, heatmap]
transforms: [regrain]
gotchas:
  - "Set `isomin`/`isomax` from the value's real range; values outside it draw nothing and the chart looks empty."
  - "x/y/z must be a complete regular grid built in the model SQL; sort on a grid index column for a stable order."
  - "Rows grow as the cube of the points per axis, and every one ships to the browser; regrain to a coarser grid first."
pairings: []
layout: {height: large, width_share: 0.5, row_role: relationship}
mobile: Touch rotation fights scroll; omit on mobile.
