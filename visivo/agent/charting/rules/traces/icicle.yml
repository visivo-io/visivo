type: icicle
family: hierarchy
status: preferred
one_liner: Hierarchy as aligned columns, one per level left to right; reads deep trees and long labels better than treemap.
use_when:
  - "A deep hierarchy where the reader walks from root to leaf (borough → zone → company → payment): each level is its own column."
  - "Siblings must be compared by size: bars share a straight baseline per column, which reads better than treemap areas or sunburst angles."
  - Long node labels (zone names, product titles) that need horizontal text.
  - "`semantics.hierarchy` with a full-width breakdown row available."
other_uses:
  - use: Flame-graph breakdown of time or cost, e.g. pipeline runtime by stage, step and query.
    how: "`tiling: {orientation: v, flip: y}` puts the root at the bottom and stacks children upward; `values: ?{ sum(<seconds>) }` with `branchvalues: total`."
avoid_when:
  - "A shallow tree with few leaves; a treemap uses the space better and is the family default."
  - "Too many leaves at full depth; the leaf column becomes hairlines, so set `maxdepth` and let the reader click in."
  - Non-additive or negative metrics; same rule as treemap.
  - "Half-width or short slots: icicles need width for levels and height for leaves."
data_shape:
  metrics: {min: 1, max: 1}
  dimensions: {min: 2, max: 5}
  dimension_roles: [categorical, geo_region, boolean]
  cardinality: {min: 3, max: 10}
required_props: [labels, parents]
example: |
  models:
    - name: trip_nodes
      sql: >-
        select pickup_borough as id, pickup_borough as label, '' as parent, count(*) as trips from trips group by all
        union all select pickup_borough || '/' || pickup_zone, pickup_zone, pickup_borough, count(*) from trips group by all
        union all select pickup_borough || '/' || pickup_zone || '/' || company as id, company as label, pickup_borough || '/' || pickup_zone as parent, count(*) as trips from trips group by all
  insights:
    - name: trips-borough-zone-company
      props:
        type: icicle
        ids: ?{ ${ref(trip_nodes).id} }
        labels: ?{ ${ref(trip_nodes).label} }
        parents: ?{ ${ref(trip_nodes).parent} }
        values: ?{ sum(${ref(trip_nodes).trips}) }
        branchvalues: total
        maxdepth: 3
        textinfo: label+value+percent parent
variations:
  - when: "a second metric that is a rate"
    then: "numeric `marker.colors` + `marker.colorscale`"
  - when: "the tree is deeper than the columns can label"
    then: "`maxdepth: 3` plus click-to-zoom; `pathbar` keeps the breadcrumb visible"
  - when: "the hierarchy reads top-down (org charts, file trees)"
    then: "`tiling: {orientation: v}`"
limits:
  series_ideal: 1
  series_max: 1
  repair: [top_n_other, input_filter]
transforms: [top_n_other, collapse_rare]
gotchas:
  - "Same row contract as treemap: UNION ALL per level, parents present as nodes, `branchvalues: total` when values are pre-summed."
  - "With `total`, a parent smaller than the sum of its children makes the whole trace fail to draw; a parent larger leaves an unlabelled gap. Compute parents from children in SQL."
  - "Repeated child labels across parents need `ids` and id-valued `parents`, or the nodes collide."
  - "`marker.colorscale` alone has no effect; it needs numeric `marker.colors`."
  - "`textinfo: percent parent` is the useful label here; `percent root` on a deep leaf rounds to 0%."
pairings: [detail_table_below, kpi_strip_above]
layout: {height: large, width_share: 1.0, row_role: breakdown}
mobile: "Switch to `tiling: {orientation: v}` and `maxdepth: 2` so levels stack down the phone instead of across it."
