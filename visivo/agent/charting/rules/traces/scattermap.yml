type: scattermap
family: geo_point
status: preferred
one_liner: Points on a tiled street map from lat/lon, sized or colored by a metric.
use_when:
  - "Two `geo_point` columns (`geo_kind: latlon`) such as pickup locations, stores or sensors, aggregated to places."
  - Regions without boundaries (NYC zones, boroughs) where you still have a centroid; the fallback for `geo_region` when `boundaries_available` is false.
  - "`intent: geo` with a 'where' question: where do trips start, where are the stores."
other_uses:
  - use: Route or GPS track on a street map, e.g. a delivery run or a vehicle's day.
    how: "`mode: lines` (or `lines+markers`) with `- sort:` on the timestamp and `split` on the vehicle or trip id; `line.width` for emphasis."
  - use: Service areas or geofences drawn as filled polygons.
    how: "`mode: lines`, `fill: toself` and one row per polygon vertex in order, `split` on the area id."
avoid_when:
  - Too many points to draw one dot each; aggregate to a grid or zone centroids, or use `densitymap`.
  - The question is 'how much per region' and boundaries exist; a choropleth reads better than sized dots.
  - No lat/lon and no centroid lookup; use a bar by region.
  - Points that all sit in one spot (an airport); show a count by location, sized, not one dot per row.
data_shape:
  metrics: {min: 0, max: 2}
  dimensions: {min: 2, max: 3}
  dimension_roles: [geo_point, categorical, boolean]
  rows: {max: 5000}
required_props: [lat, lon]
example: |
  insights:
    - name: pickups-by-zone
      props:
        type: scattermap
        lat: ?{ avg(${ref(trips).pickup_lat}) }
        lon: ?{ avg(${ref(trips).pickup_lon}) }
        text: ?{ ${ref(trips).pickup_zone} }
        mode: markers
        marker:
          size: ?{ sqrt(count(*)) }
          sizemode: diameter
      interactions:
        - split: ?{ ${ref(trips).company} }
  charts:
    - name: pickups-map
      insights: ["${ref(pickups-by-zone)}"]
      layout: {map: {center: {lat: 40.73, lon: -73.94}, zoom: 9.5}}
variations:
  - when: "a metric per place"
    then: "`marker.size` (use `sqrt` so area, not diameter, is proportional) with `marker.sizemode: diameter`"
  - when: "a categorical with 2–7 values"
    then: "`split` (one series per value, theme-colored) rather than `marker.color`"
  - when: "the points are raw rows rather than aggregated places"
    then: "`cluster.enabled: true`, or aggregate to zone or grid in SQL"
  - when: "a second metric matters"
    then: "`marker.color` from a data column with `marker.colorscale` (the legitimate color case)"
limits:
  series_ideal: 5
  series_max: 8
  repair: [top_n_other, input_filter, densitymap]
transforms: [aggregate_to_centroid, grid_bucket, top_n_other]
gotchas:
  - "Aggregate to a location first (`GROUP BY zone`, `avg(lat)`, `avg(lon)`, `count(*)`); one dot per raw row is slow and shows only density."
  - "Swapped `lat` and `lon` put every point in the ocean; check the columns' min and max (latitude stays within -90 to 90)."
  - "Set `layout.map.center` and `layout.map.zoom` from the data's bounding box; the default shows the world."
  - "Use `scattermap`, not `scattermapbox` (deprecated, needs a token); the theme styles `layout.map`."
  - "`marker.size` is in pixels: scale into roughly 6–40 (`6 + 34 * sqrt(n / max_n)`) or the biggest dot covers the city."
pairings: [chart_beside(bar), detail_table_below, kpi_strip_above]
layout: {height: large, width_share: 0.67, row_role: hero}
mobile: Full width, `large`; hide the legend and rely on `hovertemplate`.
