type: contour
family: density2d
status: niche
one_liner: Iso-lines of a z surface over a regular numeric x/y grid; a smoothed heatmap for continuous axes.
use_when:
  - "A metric already computed on a regular grid of two ordered numerics (avg fare by pickup hour × distance bucket) where the gradient matters."
  - "Response-surface or what-if grids from SQL (`generate_series` × `generate_series`) where the reader looks for ridges and thresholds."
  - "`intent: relationship` with two continuous inputs and one output, with enough values on each axis to interpolate."
other_uses:
  - use: A break-even or target region, shading where the metric clears a line (e.g. margin at or above zero).
    how: "`contours: {type: constraint, operation: '>=', value: <target>}`."
avoid_when:
  - "Raw x/y points with no z; that is `histogram2d` (or `histogram2dcontour`), which bins for you."
  - "Categorical or unordered axes (borough × company); interpolating between labels is meaningless, use a heatmap."
  - "A sparse or irregular grid; Plotly interpolates across gaps and draws contours through empty space, so regrain coarser first."
  - Too few values per axis, or exact cell values matter; a heatmap with `text` reads better.
data_shape:
  metrics: {min: 1, max: 1}
  dimensions: {min: 2, max: 2}
  dimension_roles: [numeric_continuous, numeric_discrete, time]
  cardinality: {min: 6, max: 200}
required_props: [x, y, z]
example: |
  insights:
    - name: avg-fare-by-hour-and-distance
      props:
        type: contour
        x: ?{ extract(hour from ${ref(trips).pickup_at}) }
        y: ?{ floor(${ref(trips).trip_distance}) }
        z: ?{ avg(${ref(trips).fare_amount}) }
        colorscale: Viridis
        contours: {coloring: heatmap, showlabels: true}
      interactions:
        - filter: ?{ ${ref(trips).trip_distance} < 20 }
        - sort: ?{ extract(hour from ${ref(trips).pickup_at}) ASC }
variations:
  - when: "the reader should read values off the levels"
    then: "`contours.showlabels: true` instead of a colorbar read-off"
  - when: "there are fixed thresholds that mean something"
    then: "`contours: {start, end, size}` so the levels land on them"
  - when: "z is a change against a baseline and diverges around zero"
    then: "a diverging colorscale with `zmid: 0`"
limits:
  series_ideal: 1
  series_max: 1
  repair: [regrain, bucket, heatmap, input_filter]
transforms: [bucket, regrain]
gotchas:
  - "x, y and z come from one GROUP BY over both bucketed axes (1-D columns, like heatmap); Plotly grids them by distinct x and y."
  - "Every x × y combination needs a row; missing cells are interpolated (`connectgaps`) and invent a surface. Cross-join the axes and coalesce, or regrain."
  - "Bucket raw numerics in SQL (`floor(x/step)*step`); one distinct value per raw row produces a grid of mostly empty cells."
  - "`z` is one column, not a list; a list of columns is read as a matrix with one row per column, not the intended grid."
  - "Never `split` a contour; overlapping filled surfaces hide each other."
pairings: [kpi_strip_above]
alternatives: [heatmap]
layout: {height: medium, width_share: 0.5, row_role: relationship}
mobile: Full width with `showlabels`; a colorbar beside a half-width contour leaves no plot area.
