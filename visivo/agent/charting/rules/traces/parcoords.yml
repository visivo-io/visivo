type: parcoords
family: multivariate
status: niche
tier: extended
author: opus-5.5
review: {state: pending, by: null, date: null}
confidence: 0.6
one_liner: Parallel coordinates; each row is a line across 3–8 numeric axes, brushable to filter profiles.
use_when:
  - "3–8 numeric columns per entity (zone, driver, day) and the question is which profiles co-occur — high fare + short distance + low tip."
  - "≤ ~5 000 rows, ideally aggregated per entity (one line per zone or driver), and an analyst who will brush axes."
  - "Ranking trade-offs across many measures where a splom would need too many panels."
avoid_when:
  - Fewer than 3 numeric columns — a scatter is clearer.
  - "Categorical columns as axes — parcoords wants numbers; use `parcats` for categories."
  - "More than ~5 000 lines — overplotted hairball; aggregate per entity or sample."
  - Non-analyst audiences — axis order drives the reading and brushing is not discoverable; show the 2–3 key measures as bars.
data_shape:
  metrics: {min: 3, max: 8}
  dimensions: {min: 0, max: 1}
  dimension_roles: [identifier, categorical]
  cardinality: {min: 20, max: 5000}
required_props: [dimensions]
example: test-projects/docs-examples/dashboards/parcoords/custom-ranges.visivo.yml
minimal_yaml: |
  insights:
    - name: zone-profiles
      props:
        type: parcoords
        ids: ?{ ${ref(trips).pickup_zone} }
        dimensions:
          - {label: Avg fare, values: "?{ avg(${ref(trips).fare_amount}) }"}
          - {label: Avg miles, values: "?{ avg(${ref(trips).trip_distance}) }"}
          - {label: Tip %, values: "?{ avg(${ref(trips).tip_pct}) }"}
          - {label: Trips, values: "?{ count(*) }"}
        line:
          color: ?{ avg(${ref(trips).tip_pct}) }
          colorscale: Viridis
encodings_that_scale:
  - "highlighting a measure → `line.color` bound to one numeric dimension with a sequential colorscale (the only legitimate color here)"
  - "a known region of interest → `dimensions[].constraintrange` pre-brushes an axis"
  - "unequal scales → `dimensions[].range` per axis (custom-ranges example) so axes compare honestly"
limits:
  series_ideal: 1
  series_max: 1
  repair: [sample, regrain, input_filter]
transforms: [regrain, sample, clip_p99]
visivo_gotchas:
  - "One trace, one line per row: there is no legend and a `split` overlays N parcoords on the same domain; group per entity in SQL instead."
  - "Set the grain with a non-aggregate prop (`ids: ?{ pickup_zone }`): Visivo groups by it, giving one line per zone. With no aggregate, every raw row becomes a line."
  - "`line.color` must be numeric with a `colorscale`; a constant color opts out of the theme and a CASE of strings does nothing useful."
  - "Axis order is the reading order; put the measure of interest in the middle so both neighbours relate to it."
  - "Clip tails in SQL; one outlier stretches its axis and every other line collapses to its bottom."
pairings: [detail_table_below, splom_alternative]
layout: {height: large, width_share: 1.0, row_role: relationship}
mobile: Poor below 1024 px; ≤5 axes, full width, and accept that brushing is fiddly on touch.
