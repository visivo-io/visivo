type: violin
family: distribution
status: preferred
one_liner: A box plot that also draws the density; pick it when the shape beyond quartiles matters and groups are large.
use_when:
  - "One numeric column by a categorical of 2–7 values where every group is large and the shape matters (bimodal fares, a second hump of airport trips)."
  - "Two sub-groups per category to contrast side by side: two insights with `side: negative` / `side: positive` (split violin)."
  - A box would hide the story; two groups with the same median and IQR but different shapes.
other_uses:
  - use: A raincloud plot, half violin with the raw points beside it, for groups small enough to show every row.
    how: "`side: positive`, `points: all`, `pointpos: -0.5` and `jitter: 0.3`."
avoid_when:
  - "Small groups; the kernel density invents smooth shape from a handful of points, use box with `boxpoints: all`."
  - Too many groups; the bodies get too narrow to read a shape, use box, which scales further.
  - Audiences unfamiliar with density plots, or exact figures wanted; box or a median/p99 table reads faster.
  - "A bounded or discrete column (small counts, ratings); the kernel smears past the bounds, use bar of counts or `spanmode: hard`."
data_shape:
  metrics: {min: 0, max: 0}
  dimensions: {min: 1, max: 2}
  dimension_roles: [numeric_continuous, categorical, boolean]
  cardinality: {min: 1, max: 8}
  rows_per_group: {min: 100}
required_props: [y]
example: |
  insights:
    - name: fare-shape-by-borough
      props:
        type: violin
        x: ?{ ${ref(trips).pickup_borough} }
        y: ?{ ${ref(trips).fare_amount} }
        box: {visible: true}
        meanline: {visible: true}
        points: false
      interactions:
        - filter: ?{ ${ref(trips).fare_amount} > 0 }
        - sort: ?{ ${ref(trips).pickup_borough} ASC }
variations:
  - when: "a sub-group with two values to contrast within each category"
    then: "two insights on one chart, `side: negative` and `side: positive`, each filtered to one value"
  - when: "a second categorical of 2–7 values"
    then: "`split` with the chart `layout.violinmode: group`"
  - when: "groups of very different size"
    then: "`scalemode: count` so width reflects n; the default `width` makes a small group look as solid as a large one"
limits:
  series_ideal: 4
  series_max: 8
  repair: [top_n_other, input_filter, box]
transforms: [sample]
gotchas:
  - "Raw rows, no aggregate on `y` (like box); every row is shipped and the browser runs the KDE, so sample in SQL on large tables."
  - "`points` defaults to `outliers`; `points: all` on a large group draws every row, so use `false` and `box.visible: true`."
  - "Never clip the values (`least(x, p99)`): one global cap piles every long group's tail onto one value. Zoom a long tail with `layout.yaxis.range`; `spanmode: hard` stops the kernel at the data."
  - "`split` on the same column as `x` makes one trace per group; harmless, but it doubles the legend. Split only on a second dimension."
  - "The density is smoothed (`bandwidth` auto); say 'estimated density' in the subtitle and never read a value off the outline."
pairings: [chart_beside(box), chart_beside(histogram), kpi_strip_above]
layout: {height: medium, width_share: 0.5, row_role: relationship}
mobile: "Fewer groups than on desktop, horizontal orientation (`orientation: h`, swap x/y) when labels are long; the body needs width to show shape."
