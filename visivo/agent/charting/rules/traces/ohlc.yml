type: ohlc
family: financial
status: niche
tier: extended
author: opus-5.5
review: {state: approved, by: fable-5.1, date: 2026-10-10}

confidence: 0.75
one_liner: Open/high/low/close as tick bars; a thinner candlestick for finance readers who expect bar charts.
use_when:
  - "The same OHLC shape as candlestick and the audience explicitly asks for tick bars (traders, print/monochrome)."
  - "Denser series (300–800 periods) where filled candle bodies would merge but ticks still separate."
avoid_when:
  - "No explicit ask — candlestick is the family default and reads faster for general audiences."
  - "Four metrics that are not open/high/low/close prices — the shape card alone cannot tell; use scatter lines."
  - "More than ~800 periods — regrain to weeks/months first."
  - Overlaying several securities on one price axis — use an input filter or small multiples.
data_shape:
  metrics: {min: 4, max: 4}
  dimensions: {min: 1, max: 1}
  dimension_roles: [time]
  cardinality: {min: 10, max: 800}
required_props: [x, open, high, low, close]
example: test-projects/docs-examples/dashboards/ohlc/simple.visivo.yml
minimal_yaml: |
  insights:
    - name: aapl-daily-ohlc
      props:
        type: ohlc
        x: ?{ ${ref(aapl).date} }
        open: ?{ ${ref(aapl).open} }
        high: ?{ ${ref(aapl).high} }
        low: ?{ ${ref(aapl).low} }
        close: ?{ ${ref(aapl).close} }
        tickwidth: 0.3
encodings_that_scale:
  - "volume → a `bar` insight on `yaxis: y2` in its own domain below the price (same as candlestick)"
  - "a second security → input filter on the ticker (the multi-stock docs example uses two filtered insights)"
limits:
  series_ideal: 1
  series_max: 1
  repair: [regrain, input_filter, small_multiples]
transforms: [regrain]
visivo_gotchas:
  - "Same range slider default as candlestick: set `layout.xaxis.rangeslider.visible: false` on dashboards."
  - "Same weekend gaps: `xaxis.rangebreaks: [{bounds: [sat, mon]}]` on a real date axis."
  - "Every docs example sets `increasing/decreasing.line.color` to constants, opting out of the theme; leave them unset unless the brand requires it."
  - "Regrain with first/last (`arg_min(open, date)`, `arg_max(close, date)`), never avg of opens."
pairings: [volume_bar_subplot, kpi_strip_above]
layout: {height: large, width_share: 1.0, row_role: hero}
mobile: Ticks vanish below ~2 px per period; show the last ~60 periods on phones.
