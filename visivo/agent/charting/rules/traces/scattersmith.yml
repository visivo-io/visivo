type: scattersmith
family: ternary_smith
status: niche
one_liner: Smith chart of normalized complex impedance for RF engineering; essentially never right for BI data.
use_when:
  - "RF or network-analyzer data only: normalized complex impedance or reflection (real and imaginary parts divided by Z0) swept over frequency, and the user asked for a Smith chart."
avoid_when:
  - "Any business metric; no BI shape maps to impedance, so never propose it without an explicit request."
  - "Two arbitrary numbers per row; that is an x/y scatter, and the Smith grid would distort them non-linearly."
  - "Impedance not normalized to the reference impedance (usually 50 Ω); the points land in the wrong place."
data_shape:
  metrics: {min: 2, max: 2}
  dimensions: {min: 0, max: 1}
  dimension_roles: [numeric_continuous, categorical]
  cardinality: null
required_props: [real, imag]
example: |
  insights:
    - name: antenna-impedance
      props:
        type: scattersmith
        mode: lines+markers
        real: ?{ ${ref(vna_sweep).r_ohm} / 50 }
        imag: ?{ ${ref(vna_sweep).x_ohm} / 50 }
        text: ?{ ${ref(vna_sweep).frequency_hz} }
      interactions:
        - split: ?{ ${ref(vna_sweep).device} }
        - sort: ?{ ${ref(vna_sweep).frequency_hz} ASC }
variations:
  - when: "the sweep covers several devices or runs"
    then: "`split`, one line per device"
  - when: "the reader needs to see frequency"
    then: "`text` for hover, or `marker.color` with a colorscale since it encodes data"
limits:
  series_ideal: 3
  series_max: 5
  repair: [input_filter]
transforms: []
gotchas:
  - "`real` and `imag` are normalized impedance: divide by Z0 in SQL; raw ohms put every point at the rim."
  - "Sort by frequency or the sweep zig-zags (the same rule as scatter lines)."
  - "Write every column as `${ref(model).col}`; a bare `?{ real }` collides with `real`, which is also a SQL type keyword."
pairings: []
layout: {height: large, width_share: 0.5, row_role: relationship}
mobile: Needs a square; at phone width the gridline labels collide and hover is the only readable channel.
