type: bar
family: bar
status: preferred
tier: core
author: fable-5.1
review: {state: pending, by: null, date: null}
confidence: null
one_liner: Compare a metric across categories; stacked or grouped for a second small dimension.
use_when:
  - One categorical, boolean or discrete-numeric dimension with 2–20 values and 1–3 metrics.
  - "Ranking (`intent: rank`) — sort by the metric and the bar order carries the message."
  - Time with ≤24 periods when the periods are discrete totals (months, quarters) rather than a continuous trend.
  - A second `few` dimension — stacked when parts of a whole, grouped when compared.
avoid_when:
  - More than ~20 categories — a table or a top-N + Other; the labels overlap first, then the bars vanish.
  - More than 24 time periods — a line reads the trend; columns become a comb.
  - An identifier-level dimension (zone_id, customer_id) — that is a lookup, use a table.
  - Four or more metrics side by side — grouped bars become unreadable; use a table.
data_shape:
  metrics: {min: 1, max: 3}
  dimensions: {min: 1, max: 2}
  dimension_roles: [categorical, boolean, geo_region, numeric_discrete, time]
  cardinality: {min: 2, max: 20}
required_props: [x, y]
example: test-projects/docs-examples/dashboards/bar/cohorts.visivo.yml
minimal_yaml: |
  insights:
    - name: rides-by-borough
      props:
        type: bar
        x: ?{ ${ref(trips).pickup_borough} }
        y: ?{ count(*) }
        text: ?{ count(*) }
      interactions:
        - split: ?{ ${ref(trips).company} }
        - sort: ?{ count(*) DESC }
encodings_that_scale:
  - "second `few` dimension → `split`; set chart `layout.barmode: stack` for part-of-whole, `group` otherwise"
  - "long category labels → `orientation: h` with the category on `y` (horizontal-cohorts example)"
  - "a second metric with another unit → a scatter insight on `yaxis: y2` (bar_line_dual_axis pairing)"
  - "exact values wanted → `text: ?{ <metric> }` + `textposition: outside`"
limits:
  series_ideal: 7
  series_max: 20
  repair: [top_n_other, input_filter]
transforms: [top_n_other, collapse_rare]
visivo_gotchas:
  - "A bar with no `sort` is in storage order; rank charts need `- sort: ?{ <metric> DESC }`."
  - "`barmode` lives on the chart `layout`, not the insight; a split bar without it defaults to grouped."
  - "A split on a `some`/`many` column multiplies the bars silently; read the cardinality bucket first."
  - "Setting `marker.color` to a constant drops the theme colorway; use a CASE only when color encodes a threshold."
  - "Time on `x` is plotted as a continuous axis; set `layout.xaxis.type: category` for discrete periods or the gaps misalign."
pairings: [bar_line_dual_axis, detail_table_below, kpi_strip_above]
layout: {height: medium, width_share: 0.5, row_role: breakdown}
mobile: Horizontal bars survive the stack better than vertical ones; cap at 10 visible categories.
