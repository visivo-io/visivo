type: bar
family: bar
status: preferred
one_liner: Compare a metric across categories; stacked or grouped for a second small dimension.
use_when:
  - One categorical, boolean or discrete-numeric dimension, compared across one or a few metrics.
  - "Ranking (`intent: rank`): sort by the metric and the bar order carries the message."
  - Time as discrete totals (months, quarters) rather than a continuous trend.
  - A second `few` dimension, stacked when the parts make a whole and grouped when they are compared.
other_uses:
  - use: Gantt or timeline bars, one floating bar per task or phase.
    how: "`orientation: h`, the task on `y`, `base: ?{ <start> }` and `x: ?{ <end> - <start> }`; sort by start."
  - use: Range bars (low to high per category), e.g. a daily fare range.
    how: "`base: ?{ min(<m>) }` and `y: ?{ max(<m>) - min(<m>) }`."
avoid_when:
  - Too many categories to label; use a table or a top-N + Other. Labels overlap first, then the bars vanish.
  - A long run of time periods; a line reads the trend, columns become a comb.
  - An identifier-level dimension (zone_id, customer_id); that is a lookup, use a table.
  - Too many metrics side by side; grouped bars stop being comparable, use a table.
data_shape:
  metrics: {min: 1, max: 3}
  dimensions: {min: 1, max: 2}
  dimension_roles: [categorical, boolean, geo_region, numeric_discrete, time]
  cardinality: {min: 2, max: 20}
  axis_points: {max: 24}
required_props: [x, y]
example: |
  insights:
    - name: rides-by-borough
      props:
        type: bar
        x: ?{ ${ref(trips).pickup_borough} }
        y: ?{ count(*) }
        text: ?{ count(*) }
      interactions:
        - split: ?{ ${ref(trips).company} }
        - sort: ?{ count(*) DESC }
variations:
  - when: "second `few` dimension"
    then: "`split`; set chart `layout.barmode: stack` for part-of-whole, `group` otherwise"
  - when: "long category labels"
    then: "`orientation: h` with the category on `y` (horizontal-cohorts example)"
  - when: "a second metric with another unit"
    then: "a scatter insight on `yaxis: y2` (bar_line_dual_axis pairing)"
  - when: "exact values wanted"
    then: "`text: ?{ <metric> }` + `textposition: outside`"
limits:
  series_ideal: 7
  series_max: 20
  repair: [top_n_other, input_filter]
transforms: [top_n_other, collapse_rare]
gotchas:
  - "A bar with no `sort` is in storage order; rank charts need `- sort: ?{ <metric> DESC }`."
  - "`barmode` lives on the chart `layout`, not the insight; a split bar without it defaults to grouped."
  - "A split on a `some`/`many` column multiplies the bars silently; read the cardinality bucket first."
  - "Setting `marker.color` to a constant drops the theme colorway; use a CASE only when color encodes a threshold."
  - "Time on `x` is plotted as a continuous axis; set `layout.xaxis.type: category` for discrete periods or the gaps misalign."
pairings: [bar_line_dual_axis, detail_table_below, kpi_strip_above]
layout: {height: medium, width_share: 0.5, row_role: breakdown}
mobile: Horizontal bars survive the stack better than vertical ones; show a top-N rather than every category.
